        await setDoc(getDocRef('system', 'departments'), { list: newList });
        window.closeEditDeptModal();
      } catch (err) {
        console.error("Error editing department:", err);
        alert("修改失敗：" + err.message);
      }
    };

    // 渲染操作日誌清單 (頁籤四)
    window.renderAuditLogsList = () => {
      const container = document.getElementById('auditLogsContainer');
      if (!container) return;

      const searchTerm = (document.getElementById('logSearchInput').value || '').trim().toLowerCase();
      const actionFilter = document.getElementById('logActionFilter').value;

      // 篩選過濾
      const filtered = localAuditLogs.filter(log => {
        // 1. 動作篩選
        if (actionFilter !== 'ALL' && log.action !== actionFilter) return false;
        // 2. 關鍵字篩選 (人名、部門、檔案名稱、細節)
        if (searchTerm) {
          const matchName = (log.operatorName || '').toLowerCase().includes(searchTerm);
          const matchDept = (log.operatorDept || '').toLowerCase().includes(searchTerm);
          const matchFile = (log.fileName || '').toLowerCase().includes(searchTerm);
          const matchDetail = (log.details || '').toLowerCase().includes(searchTerm);
          return matchName || matchDept || matchFile || matchDetail;
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--color-muted); padding: 20px; font-size: 0.85rem;">暫無符合條件的操作日誌</div>`;
        return;
      }

      container.innerHTML = filtered.map(log => {
        const dateStr = new Date(log.timestamp).toLocaleString();
        let actionBadge = '';
        if (log.action === 'UPLOAD') {
          actionBadge = '<span class="category-badge" style="background-color: var(--color-primary-light); color: var(--color-primary); border-color: var(--color-primary-border); font-size: 0.7rem; padding: 2px 6px;">上傳</span>';
        } else if (log.action === 'DOWNLOAD') {
          actionBadge = '<span class="category-badge" style="background-color: var(--color-success-light); color: var(--color-success); border-color: var(--color-success-border); font-size: 0.7rem; padding: 2px 6px;">下載</span>';
        } else if (log.action === 'PREVIEW') {
          actionBadge = '<span class="category-badge" style="background-color: rgba(99, 102, 241, 0.1); color: rgb(99, 102, 241); border-color: rgba(99, 102, 241, 0.2); font-size: 0.7rem; padding: 2px 6px;">預覽</span>';
        } else if (log.action === 'EDIT') {
          actionBadge = '<span class="category-badge" style="background-color: var(--color-warning-light); color: var(--color-warning); border-color: var(--color-warning-border); font-size: 0.7rem; padding: 2px 6px;">編輯</span>';
        } else if (log.action === 'DELETE') {
          actionBadge = '<span class="category-badge" style="background-color: rgba(239, 68, 68, 0.1); color: var(--color-danger); border-color: rgba(239, 68, 68, 0.2); font-size: 0.7rem; padding: 2px 6px;">刪除</span>';
        }

        return `
          <div style="padding: 10px 12px; border-bottom: 1px solid var(--color-border); font-size: 0.78rem; display: flex; flex-direction: column; gap: 4px; background-color: var(--color-surface); margin-bottom: 4px; border-radius: var(--radius-sm);">
            <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px;">
              <span style="font-weight: 700; color: var(--color-dark);">${log.operatorName} (${log.operatorDept})</span>
              <span style="color: var(--color-muted); font-size: 0.72rem;">${dateStr}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
              ${actionBadge}
              <span style="font-weight: 500; color: var(--color-dark); flex: 1; word-break: break-all;">
                檔案: <span style="text-decoration: underline;">${log.fileName || '無'}</span>
              </span>
            </div>
            <div style="color: var(--color-muted); font-size: 0.74rem; background-color: var(--color-bg-dark); padding: 4px 8px; border-radius: 4px; margin-top: 2px;">
              細節: ${log.details || ''}
            </div>
          </div>
        `;
      }).join('');
    };

    // 渲染特定角色的授權配置狀態
    window.renderRolePermissionsConfig = () => {
      const select = document.getElementById('selectRoleConfig');
      const role = select.value;
      const perms = localPermissions[role] || { upload: false, editOwn: false, editAll: false, deleteOwn: false, deleteAll: false, manageCategory: false, manageStaff: false };
      
      document.getElementById('perm_upload').checked = !!perms.upload;
      document.getElementById('perm_editOwn').checked = !!perms.editOwn;
      document.getElementById('perm_editAll').checked = !!perms.editAll;
      document.getElementById('perm_deleteOwn').checked = !!perms.deleteOwn;
      document.getElementById('perm_deleteAll').checked = !!perms.deleteAll;
      document.getElementById('perm_manageCategory').checked = !!perms.manageCategory;
      
      const manageStaffCheckbox = document.getElementById('perm_manageStaff');
      manageStaffCheckbox.checked = !!perms.manageStaff;
      
      // Admin 防鎖定
      if (role === 'Admin') {
        manageStaffCheckbox.checked = true;
        manageStaffCheckbox.disabled = true;
      } else {
        manageStaffCheckbox.disabled = false;
      }
    };

    // 儲存角色權限配置
    window.saveRolePermissions = async () => {
      if (!currentUser || currentUserRole !== 'Admin') return;
      
      const select = document.getElementById('selectRoleConfig');
      const role = select.value;
      const msgBox = document.getElementById('permissionsSaveMessage');
      
      msgBox.classList.remove('active');

      const updatedPerms = {
        upload: document.getElementById('perm_upload').checked,
        editOwn: document.getElementById('perm_editOwn').checked,
        editAll: document.getElementById('perm_editAll').checked,
        deleteOwn: document.getElementById('perm_deleteOwn').checked,
        deleteAll: document.getElementById('perm_deleteAll').checked,
        manageCategory: document.getElementById('perm_manageCategory').checked,
        manageStaff: (role === 'Admin') ? true : document.getElementById('perm_manageStaff').checked
      };

      try {
        const fullPermissions = { ...localPermissions };
        fullPermissions[role] = updatedPerms;

        await setDoc(getDocRef('system', 'permissions'), fullPermissions);

        msgBox.textContent = `角色「${role}」的權限項目已更新成功！`;
        msgBox.className = "msg-box msg-box-warning active";
        msgBox.style.backgroundColor = "var(--color-primary-light)";
        msgBox.style.color = "var(--color-primary)";
        msgBox.style.borderColor = "var(--color-primary-border)";

        setTimeout(() => {
          msgBox.classList.remove('active');
        }, 3000);
      } catch (err) {
        console.error("Failed to update role permissions: ", err);
        msgBox.textContent = "更新失敗：" + err.message;
        msgBox.className = "msg-box msg-box-danger active";
      }
    };

    // 控制新增人員密碼輸入框隱顯
    window.toggleNewStaffPasswordInput = (select) => {
      const pwInput = document.getElementById('newStaffPassword');
      if (select.value === 'Viewer') {
        pwInput.style.display = 'none';
        pwInput.removeAttribute('required');
        pwInput.value = '';
      } else {
        pwInput.style.display = 'block';
        pwInput.setAttribute('required', 'true');
      }
    };

    // 控制編輯人員密碼輸入框隱顯
    window.toggleEditStaffPasswordInput = (select) => {
      const group = document.getElementById('editStaffPasswordGroup');
      const pwInput = document.getElementById('editStaffInputPassword');
      if (select.value === 'Viewer') {
        group.style.display = 'none';
        pwInput.removeAttribute('required');
        pwInput.value = '';
      } else {
        group.style.display = 'flex';
        pwInput.setAttribute('required', 'true');
      }
    };

    // 渲染人員清單 (顯示部門資訊)
    window.renderStaffList = () => {
      const container = document.getElementById('staffListContainer');
      if (!container) return;

      container.innerHTML = localAttendance.map(p => {
        const roleStr = getRoleFromMember(p);
        let roleLabel = '檢視者 (Viewer)';
        if (roleStr === 'Admin') roleLabel = '<span style="color:var(--color-warning); font-weight:700;">管理員 (Admin)</span>';
        else if (roleStr === 'Editor') roleLabel = '<span style="color:var(--color-success); font-weight:700;">編輯管理員 (Editor)</span>';
        else if (roleStr === 'Uploader') roleLabel = '<span style="color:var(--color-primary); font-weight:700;">上傳者 (Uploader)</span>';

        const plainPassword = p.password || '';
        const deptStr = p.department || '研發部';

        return `
          <div class="cat-list-item">
            <div class="cat-list-item-left" style="flex-direction: column; align-items: flex-start; gap: 2px;">
              <span style="font-weight: 700; color: var(--color-dark);">${p.name}</span>
              <span style="font-size: 0.75rem; color: var(--color-muted);">${p.role} - ${deptStr} (${roleLabel})</span>
            </div>
            <div>
              <button onclick="window.openEditStaffModal('${p.id}', '${p.name.replace(/'/g, "\\'")}', '${p.role.replace(/'/g, "\\'")}', '${roleStr}', '${plainPassword.replace(/'/g, "\\'")}', '${deptStr}')" class="btn-icon" title="修改資訊">
                <i data-lucide="edit-3" class="w-4 h-4"></i>
              </button>
              <button onclick="window.promptDeleteStaff('${p.id}', '${p.name.replace(/'/g, "\\'")}')" class="btn-icon text-danger" title="人員除名" style="color: var(--color-danger);">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    };

    // 登錄新人員 (支援部門設定)
    window.submitNewStaff = async (e) => {
      e.preventDefault();
      if (!currentUser || currentUserRole !== 'Admin') return;

      const nameInput = document.getElementById('newStaffName');
      const roleInput = document.getElementById('newStaffRole');
      const deptInput = document.getElementById('newStaffDept');
      const permissionInput = document.getElementById('newStaffPermission');
      const pwInput = document.getElementById('newStaffPassword');
      
      const name = nameInput.value.trim();
      const role = roleInput.value.trim();
      const department = deptInput.value;
      const permission = permissionInput.value;
      const password = pwInput.value.trim();

      if (name && role) {
        const order = localAttendance.length > 0 ? Math.max(...localAttendance.map(p => p.order || 0)) + 1 : 1;
        
        const newMember = {
          name,
          role,
          department,
          permission,
          order,
          schedule: ['OFFICE', 'OFFICE', 'OFFICE', 'OFFICE', 'OFFICE']
        };

        if (permission !== 'Viewer') {
          newMember.password = password;
        }

        await addDoc(getCollectionRef('attendance'), newMember);
        
        nameInput.value = '';
        roleInput.value = '';
        permissionInput.value = 'Viewer';
        pwInput.value = '';
        pwInput.style.display = 'none';
        
        window.renderStaffList();
      }
    };

    // 開啟編輯人員 Modal
    window.openEditStaffModal = (id, oldName, oldRole, permission, password, department) => {
      if (currentUserRole !== 'Admin') return;
      editStaffContext = { id, oldName, oldRole, permission, password, department };
      document.getElementById('editStaffInputName').value = oldName;
      document.getElementById('editStaffInputRole').value = oldRole;
      document.getElementById('editStaffInputPermission').value = permission;
      document.getElementById('editStaffInputPassword').value = password || '';
      document.getElementById('editStaffInputDept').value = department || '研發部';
      
      const group = document.getElementById('editStaffPasswordGroup');
      const pwInput = document.getElementById('editStaffInputPassword');
      
      if (permission === 'Viewer') {
        group.style.display = 'none';
        pwInput.removeAttribute('required');
      } else {
        group.style.display = 'flex';
        pwInput.setAttribute('required', 'true');
      }

      openModal('editStaffModal');
    };

    window.closeEditStaffModal = () => {
      closeModal('editStaffModal');
      editStaffContext = null;
    };

    // 確認編輯人員資訊
    window.confirmEditStaff = async () => {
      if (!currentUser || !editStaffContext || currentUserRole !== 'Admin') return;

      const newName = document.getElementById('editStaffInputName').value.trim();
      const newRole = document.getElementById('editStaffInputRole').value.trim();
      const newPermission = document.getElementById('editStaffInputPermission').value;
      const newPassword = document.getElementById('editStaffInputPassword').value.trim();
      const newDept = document.getElementById('editStaffInputDept').value;

      const nameChanged = newName !== editStaffContext.oldName;
      const roleChanged = newRole !== editStaffContext.oldRole;
      const permissionChanged = newPermission !== editStaffContext.permission;
      const passwordChanged = newPassword !== (editStaffContext.password || '');
      const deptChanged = newDept !== editStaffContext.department;

      if (nameChanged || roleChanged || permissionChanged || passwordChanged || deptChanged) {
        
        if (nameChanged) {
          const filesToUpdate = localFiles.filter(f => f.uploader === editStaffContext.oldName);
          for (let f of filesToUpdate) {
            await updateDoc(getDocRef('files', f.id), { uploader: newName });
          }
          
          if (editStaffContext.id === currentUserId) {
            currentUserName = newName;
            localStorage.setItem('repo_user_name', currentUserName);
          }
        }

        if (editStaffContext.id === currentUserId) {
          if (permissionChanged) {
            currentUserRole = newPermission;
            localStorage.setItem('repo_user_role', currentUserRole);
          }
          if (deptChanged) {
            currentUserDept = newDept;
            localStorage.setItem('repo_user_dept', currentUserDept);
          }
        }

        const updatedData = {
          name: newName,
          role: newRole,
          permission: newPermission,
          department: newDept
        };

        if (newPermission !== 'Viewer') {
          updatedData.password = newPassword;
        } else {
          updatedData.password = '';
        }

        await updateDoc(getDocRef('attendance', editStaffContext.id), updatedData);

        window.checkPermissions();
      }
      
      window.closeEditStaffModal();
      window.renderStaffList();
    };

    // 刪除人員 / 除名
    window.promptDeleteStaff = (id, name) => {
      if (currentUserRole !== 'Admin') return;

      window.openConfirmModal('人員除名確認', `您確定要將「${name}」自人員編制庫中移除嗎？這會同步將其除名出勤管理與值日排程。`, async () => {
        if (!currentUser) return;
        await deleteDoc(getDocRef('attendance', id));
        
        if (id === currentUserId) {
          currentUserName = '一般訪客';
          currentUserRole = 'Viewer';
          currentUserId = 'visitor';
          currentUserDept = '一般訪客';
          localStorage.setItem('repo_user_name', currentUserName);
          localStorage.setItem('repo_user_role', currentUserRole);
          localStorage.setItem('repo_user_id', currentUserId);
          localStorage.setItem('repo_user_dept', currentUserDept);
          window.checkPermissions();
          window.renderFileCategories();
          window.renderFiles();
        }

        window.closeConfirmModal();
        window.renderStaffList();
      });
    };

    // ===================================
    //  頁面元件渲染邏輯 (Vanilla JS & CSS)
    // ===================================

    // 渲染置頂最新發布膠囊列 (方案 A)
    window.renderRecentUploads = () => {
      const wrapper = document.getElementById('recentUploadsWrapper');
      const container = document.getElementById('recentUploadsContainer');
      if (!wrapper || !container) return;

      if (isRecentUploadsHidden) {
        wrapper.style.display = 'none';
        return;
      }

      const threeDaysAgo = Date.now() - (3 * 24 * 60 * 60 * 1000);
      const recent = localFiles.filter(f => {
        if (!f.createdAt || f.createdAt < threeDaysAgo) return false;
        // 模式 A：檢查該檔案所屬分類對當前使用者是否可見 (父層隱藏子層連帶隱藏)
        if (!isCategoryVisible(f.category)) return false;
        // 檢查發行適用部門 (僅限制非 Admin 的人員)
        if (currentUserRole !== 'Admin') {
          const effectiveDepts = getEffectiveTargetDepts(f);
          if (!effectiveDepts.includes('全公司') && !effectiveDepts.includes(currentUserDept)) return false;
        }
        return true;
      }).sort((a, b) => b.createdAt - a.createdAt);

      if (recent.length === 0) {
        wrapper.style.display = 'none';
        return;
      }

      wrapper.style.display = 'block';

      container.innerHTML = recent.slice(0, 5).map(file => {
        const rolePerms = localPermissions[currentUserRole] || { upload: false, editOwn: false, editAll: false, deleteOwn: false, deleteAll: false, manageCategory: false, manageStaff: false };
        const isOwnFile = (file.uploader === currentUserName) || 
                          (file.uploader === currentUserDept) || 
                          (file.uploader === `${currentUserDept} (公用)`);

        const canEdit = rolePerms.editAll || (rolePerms.editOwn && isOwnFile);
        const canDelete = rolePerms.deleteAll || (rolePerms.deleteOwn && isOwnFile);

        const ext = ((file.fileName || file.name || '').split('.').pop() || '').toLowerCase();
        let iconName = 'file-text';
        let iconColor = '#0284c7';
        if (ext === 'ppt' || ext === 'pptx') {
          iconName = 'presentation';
          iconColor = '#ea580c';
        } else if (ext === 'xls' || ext === 'xlsx') {
          iconName = 'file-spreadsheet';
          iconColor = '#10b981';
        } else if (ext === 'pdf') {
          iconName = 'file-text';
          iconColor = '#ef4444';
        }

        const dateStr = file.date ? (file.date.length > 5 ? file.date.slice(5) : file.date) : '';
        const shortUploader = file.uploader ? file.uploader.split(' ')[0] : '';

        return `
          <div class="recent-pill" style="display: inline-flex; align-items: center; gap: 8px; background: #ffffff; border: 1px solid #fed7aa; padding: 4px 10px; border-radius: var(--radius-full); font-size: 0.76rem; transition: all 0.2s ease; box-shadow: 0 1px 2px rgba(0,0,0,0.03);" onmouseover="this.style.borderColor='#f97316'; this.style.boxShadow='0 2px 5px rgba(234,88,12,0.12)'" onmouseout="this.style.borderColor='#fed7aa'; this.style.boxShadow='0 1px 2px rgba(0,0,0,0.03)'">
            <div style="display: inline-flex; align-items: center; gap: 5px; cursor: pointer;" onclick="window.openPreviewModal('${file.id}', '${file.name.replace(/'/g, "\\'")}', '${file.url}')" title="點擊預覽：${file.name}">
              <i data-lucide="${iconName}" class="w-3.5 h-3.5" style="color: ${iconColor}; flex-shrink: 0;"></i>
              <span style="font-weight: 700; color: var(--color-dark); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${file.name}</span>
            </div>
            
            <span style="color: var(--color-muted); font-size: 0.68rem; flex-shrink: 0;">${shortUploader ? shortUploader + ' · ' : ''}${dateStr}</span>
            
            <div style="display: inline-flex; align-items: center; gap: 2px; margin-left: 2px; border-left: 1px solid #fed7aa; padding-left: 5px;">
              <button onclick="window.openPreviewModal('${file.id}', '${file.name.replace(/'/g, "\\'")}', '${file.url}')" title="線上預覽" style="background: none; border: none; cursor: pointer; color: var(--color-primary); padding: 2px 4px; display: inline-flex; align-items: center; border-radius: 4px; transition: background 0.15s;" onmouseover="this.style.background='var(--color-primary-light)'" onmouseout="this.style.background='none'">
                <i data-lucide="eye" class="w-3.5 h-3.5"></i>
              </button>
              ${currentUserRole !== 'Viewer' ? `
                <a href="${file.url}" target="_blank" onclick="window.incrementDownloadCount('${file.id}')" title="下載檔案" style="color: var(--color-muted); padding: 2px 4px; display: inline-flex; align-items: center; border-radius: 4px; text-decoration: none; transition: all 0.15s;" onmouseover="this.style.color='var(--color-dark)'; this.style.background='#f1f5f9'" onmouseout="this.style.color='var(--color-muted)'; this.style.background='none'">
                  <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                </a>
              ` : ''}
              ${canEdit ? `
                <button onclick="window.openAddFileModal(event, '${file.id}')" title="編輯檔案" style="background: none; border: none; cursor: pointer; color: var(--color-muted); padding: 2px 4px; display: inline-flex; align-items: center; border-radius: 4px; transition: all 0.15s;" onmouseover="this.style.color='var(--color-dark)'; this.style.background='#f1f5f9'" onmouseout="this.style.color='var(--color-muted)'; this.style.background='none'">
                  <i data-lucide="edit-3" class="w-3 h-3"></i>
                </button>
              ` : ''}
              ${canDelete ? `
                <button onclick="window.promptDeleteFile('${file.id}', '${file.name.replace(/'/g, "\\'")}')" title="刪除檔案" style="background: none; border: none; cursor: pointer; color: var(--color-danger); padding: 2px 4px; display: inline-flex; align-items: center; border-radius: 4px; transition: all 0.15s;" onmouseover="this.style.background='var(--color-danger-light)'" onmouseout="this.style.background='none'">
                  <i data-lucide="trash-2" class="w-3 h-3"></i>
                </button>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    };

    // 渲染檔案清單 (動態綁定安全角色限制與發行部門過濾)
    window.renderFiles = () => {
      const container = document.getElementById('fileListContainer');
      if (!container) return;

      const searchTerm = (document.getElementById('fileSearchInput')?.value || '').trim().toLowerCase();
      
      // 當點選了非「全部」分類，或搜尋欄有輸入文字時，工作階段永久隱藏最新上傳專區 (方案 B)
      if (selectedCategory !== '全部' || searchTerm !== '') {
        isRecentUploadsHidden = true;
      }

      // 渲染置頂最新上傳專區
      window.renderRecentUploads();
      
      const ROLE_WEIGHT = { 'Viewer': 0, 'Uploader': 1, 'Editor': 2, 'Admin': 3 };

      const filtered = localFiles.filter(file => {
        // 1. 關鍵字比對
        const resolvedCatName = resolveCategoryName(file.category);
        const matchesSearch = file.name.toLowerCase().includes(searchTerm) || 
                              resolvedCatName.toLowerCase().includes(searchTerm) || 
                              (file.uploader && file.uploader.toLowerCase().includes(searchTerm)) ||
                              (file.fileName && file.fileName.toLowerCase().includes(searchTerm));
        
        // 2. 分類標籤篩選 (支援 5 層任意節點篩選)
        let matchesCategory = false;
        if (selectedCategory === '全部') {
          // 全部檔案模式下，僅顯示所屬分類對當前使用者可見的檔案 (模式 A 完全隱形)
          if (!isCategoryVisible(file.category)) return false;
          matchesCategory = true;
        } else {
          // 若當前選取的分類對該使用者不可見，直接不匹配
          if (!isCategoryVisible(selectedCategory)) return false;

          const selCatDoc = localFileCategories.find(c => c.id === selectedCategory || c.name === selectedCategory);
          if (selCatDoc) {
            const validCatIds = getAllDescendantCategoryIds(selCatDoc.id);
            const fileCatDoc = localFileCategories.find(c => c.id === file.category || c.name === file.category);
            if (fileCatDoc && validCatIds.includes(fileCatDoc.id)) {
              matchesCategory = true;
            } else if (validCatIds.includes(file.category)) {
              matchesCategory = true;
            }
          }
        }

        if (!matchesSearch || !matchesCategory) return false;

        // 3. 安全角色限制比對 (繼承與覆寫)
        const effectiveAccess = getEffectiveAccessLevel(file);
        const userRoleWeight = ROLE_WEIGHT[currentUserRole] || 0;
        const fileRoleWeight = ROLE_WEIGHT[effectiveAccess] || 0;
        if (userRoleWeight < fileRoleWeight) return false;

        // 4. 發行適用部門篩選 (僅限制非 Admin 的人員，Admin 可跨部門查看)
        if (currentUserRole !== 'Admin') {
          const effectiveDepts = getEffectiveTargetDepts(file);
          if (!effectiveDepts.includes('全公司') && !effectiveDepts.includes(currentUserDept)) {
            return false;
          }
        }

        return true;
      }).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i data-lucide="folder-open" class="w-12 h-12"></i>
            <p>找不到符合條件的技術檔案</p>
          </div>`;
        lucide.createIcons();
        window.updateBatchActionsBar();
        return;
      }

      container.innerHTML = filtered.map(file => {
        const isChecked = selectedFileIds.includes(file.id);
        const descriptionHtml = file.description ? `<div class="file-desc-text" title="${file.description.replace(/"/g, '&quot;')}">${file.description}</div>` : '';
        
        // 讀取角色擁有的權限設定
        const rolePerms = localPermissions[currentUserRole] || { upload: false, editOwn: false, editAll: false, deleteOwn: false, deleteAll: false, manageCategory: false, manageStaff: false };
        
        // 判定是否為自己（個人或所屬部門公用/一般）上傳的檔案，以實現編輯自己檔案之權限
        const isOwnFile = (file.uploader === currentUserName) || 
                          (file.uploader === currentUserDept) || 
                          (file.uploader === `${currentUserDept} (公用)`);

        const canEdit = rolePerms.editAll || (rolePerms.editOwn && isOwnFile);
        const canDelete = rolePerms.deleteAll || (rolePerms.deleteOwn && isOwnFile);

        const actionIcons = (canEdit || canDelete) ? `
          ${canEdit ? `
            <button onclick="window.openAddFileModal(event, '${file.id}')" class="btn-icon" title="編輯檔案資訊">
              <i data-lucide="edit-3" class="w-4 h-4"></i>
            </button>
          ` : ''}
          ${canDelete ? `
            <button onclick="window.promptDeleteFile('${file.id}', '${file.name.replace(/'/g, "\\'")}')" class="btn-icon text-danger" title="刪除檔案" style="color: var(--color-danger);">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          ` : ''}
        ` : '';

        // 計算並標記發行部門
        const displayDepts = getEffectiveTargetDepts(file).join(', ');
        
        // 解析並取得合適的顯示分類名稱
        const displayCategory = resolveCategoryName(file.category);

        if (viewMode === 'grid') {
          // 網格卡片視圖 HTML
          return `
            <div class="file-item">
              <div class="file-item-header">
                <div class="file-selection">
                  <input type="checkbox" class="file-checkbox" value="${file.id}" ${isChecked ? 'checked' : ''} onchange="window.handleFileSelect(this, '${file.id}')">
                </div>
                <div class="file-actions" style="margin-left: auto;">
                  ${actionIcons}
                </div>
              </div>
              
              <div class="file-meta-side">
                <div style="display: flex; align-items: center; gap: 12px; width: 100%;">
                  ${getFileIconMarkup(file.fileName || file.name, false)}
                  <div class="file-info" style="min-width: 0;">
                    <h4 class="file-title" title="${file.name}">${file.name}</h4>
                  </div>
                </div>
                
                <div class="file-details" style="width: 100%; gap: 6px;">
                  <span class="category-badge">${displayCategory}</span>
                  <span class="category-badge" style="background-color: var(--color-success-light); border-color: var(--color-success-border); color: var(--color-success); font-size: 0.7rem;" title="發行對象">對象: ${displayDepts}</span>
                  <span>時間: ${file.date}</span>
                  <span>大小: ${file.size || 'N/A'}</span>
                  <span class="detail-uploader"><i data-lucide="user" class="w-3 h-3"></i>${file.uploader || '系統'}</span>
                  <span class="detail-downloads"><i data-lucide="download" class="w-3 h-3"></i>${file.downloads || 0}次</span>
                </div>
                ${descriptionHtml}
              </div>
              
              <div class="file-actions" style="width: 100%; margin-top: 12px; border-top: 1px solid var(--color-border); padding-top: 12px; display: flex; gap: 8px; justify-content: flex-end; align-items: center;">
                <button onclick="window.openPreviewModal('${file.id}', '${file.name.replace(/'/g, "\\'")}', '${file.url}')" class="btn btn-secondary btn-xs" style="padding: 6px 10px; font-weight: 700; gap: 4px; display: inline-flex; align-items: center; font-size: 0.72rem;">
                  <i data-lucide="eye" class="w-3.5 h-3.5"></i> ${currentUserRole === 'Viewer' ? '線上預覽' : '預覽'}
                </button>
                ${currentUserRole !== 'Viewer' ? `
                  <a href="${file.url}" target="_blank" onclick="window.incrementDownloadCount('${file.id}')" class="btn-download" style="display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; font-size: 0.72rem;">
                    <i data-lucide="external-link" class="w-3.5 h-3.5"></i> 下載
                  </a>
                ` : ''}
              </div>
            </div>
          `;
        } else {
          // 列表視圖 HTML
          return `
            <div class="file-item">
              <div class="file-selection">
                <input type="checkbox" class="file-checkbox" value="${file.id}" ${isChecked ? 'checked' : ''} onchange="window.handleFileSelect(this, '${file.id}')">
              </div>
              <div class="file-meta-side">
                ${getFileIconMarkup(file.fileName || file.name, false)}
                <div class="file-info">
                  <h4 class="file-title" title="${file.name}">${file.name}</h4>
                  <div class="file-details">
                    <span class="category-badge">${displayCategory}</span>
                    <span class="category-badge" style="background-color: var(--color-success-light); border-color: var(--color-success-border); color: var(--color-success); font-size: 0.7rem;" title="發行對象">發行對象: ${displayDepts}</span>
                    <span>上傳時間: ${file.date}</span>
                    <span>大小: ${file.size || 'N/A'}</span>
                    <span class="detail-uploader"><i data-lucide="user" class="w-3 h-3" style="margin-right: 2px;"></i>${file.uploader || '系統'}</span>
                    <span class="detail-downloads"><i data-lucide="download" class="w-3 h-3" style="margin-right: 2px;"></i>${file.downloads || 0} 次下載</span>
                  </div>
                  ${descriptionHtml}
                </div>
              </div>
              <div class="file-actions" style="display: flex; gap: 8px; align-items: center;">
                ${actionIcons}
                <button onclick="window.openPreviewModal('${file.id}', '${file.name.replace(/'/g, "\\'")}', '${file.url}')" class="btn btn-secondary btn-xs" style="padding: 6px 10px; font-weight: 700; gap: 4px; display: inline-flex; align-items: center; font-size: 0.72rem;">
                  <i data-lucide="eye" class="w-3.5 h-3.5"></i> ${currentUserRole === 'Viewer' ? '線上預覽' : '預覽'}
                </button>
                ${currentUserRole !== 'Viewer' ? `
                  <a href="${file.url}" target="_blank" onclick="window.incrementDownloadCount('${file.id}')" class="btn-download" style="display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; font-size: 0.72rem;">
                    <i data-lucide="external-link" class="w-3.5 h-3.5"></i> <span class="btn-text">下載</span>
                  </a>
                ` : ''}
              </div>
            </div>
          `;
        }
      }).join('');
      
      lucide.createIcons();
      window.updateBatchActionsBar();
    };

    window.toggleCategoryCollapse = (catId, event) => {
      if (event) event.stopPropagation(); // 阻止氣泡事件以防止點擊展開鈕時觸發分類選擇
      const current = collapsedCategories[catId] !== undefined ? collapsedCategories[catId] : true;
      collapsedCategories[catId] = !current;
      window.renderFileCategories();
    };

    // 渲染分類樹狀過濾列 (支援 5 層遞迴樹狀圖)
    window.renderFileCategories = () => {
      const container = document.getElementById('categoryTreeContainer');
      if (!container) return;

      // 防呆：若當前選取的分類在當前身分下不可見，自動重置為 '全部'
      if (selectedCategory !== '全部' && !isCategoryVisible(selectedCategory)) {
        selectedCategory = '全部';
      }

      const isAllActive = selectedCategory === '全部';
      
      let html = `<ul class="category-tree-list">`;
      
      // 渲染「全部檔案」選項
      html += `
        <li class="category-tree-item">
          <div class="category-tree-row ${isAllActive ? 'active' : ''}" onclick="window.selectCategory('全部')" title="全部技術檔案">
            <span style="width: 18px; flex-shrink: 0; display: inline-block;"></span>
            <span class="category-tree-icon">
              <i data-lucide="files" class="w-4 h-4"></i>
            </span>
            <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; font-size: 0.85rem;">全部檔案</span>
          </div>
        </li>
      `;

      function renderTreeNodes(parentId = null, depth = 1) {
        if (depth > 5) return '';
        let nodes = localFileCategories.filter(c => parentId === null ? !c.parentId : c.parentId === parentId);
        
        // 模式 A：完全隱形過濾 (父層隱藏，子層連帶隱藏)
        nodes = nodes.filter(c => isCategoryVisible(c.id));

        nodes.sort((a, b) => {
          if (a.isProtected !== b.isProtected) return a.isProtected ? -1 : 1;
          const orderA = a.sortOrder !== undefined ? a.sortOrder : 0;
          const orderB = b.sortOrder !== undefined ? b.sortOrder : 0;
          return orderA - orderB || a.createdAt - b.createdAt;
        });

        if (nodes.length === 0) return '';

        let out = '';
        nodes.forEach(cat => {
          const children = localFileCategories.filter(c => c.parentId === cat.id);
          const hasChildren = children.length > 0 && depth < 5;
          const isCollapsed = collapsedCategories[cat.id] !== undefined ? collapsedCategories[cat.id] : true;
          const isActive = selectedCategory === cat.id || selectedCategory === cat.name;

          let toggleHtml = '';
          if (hasChildren) {
            toggleHtml = `
              <span class="category-tree-toggle" onclick="window.toggleCategoryCollapse('${cat.id}', event)" title="${isCollapsed ? '展開子分類' : '收合子分類'}">
                <i data-lucide="${isCollapsed ? 'chevron-right' : 'chevron-down'}" class="w-3.5 h-3.5"></i>
              </span>
            `;
          } else {
            toggleHtml = `<span style="width: 18px; flex-shrink: 0; display: inline-block;"></span>`;
          }

          let iconName = 'folder';
          if (cat.isProtected) iconName = 'lock';
          else if (depth === 1) iconName = 'folder-tree';
          else if (depth >= 4) iconName = 'file-text';
          else iconName = 'folder';

          const fullPath = getCategoryPath(cat.id);

          out += `
            <li class="category-tree-item">
              <div class="category-tree-row ${isActive ? 'active' : ''}" onclick="window.selectCategory('${cat.id}')" title="${fullPath} (第 ${depth} 層)">
                ${toggleHtml}
                <span class="category-tree-icon">
                  <i data-lucide="${iconName}" class="w-3.5 h-3.5 ${cat.isProtected ? 'text-primary' : ''}"></i>
                </span>
                <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; font-size: 0.85rem;">${cat.name}</span>
              </div>
              
              ${hasChildren && !isCollapsed ? `
                <div class="category-tree-children">
                  <ul class="category-tree-list">
                    ${renderTreeNodes(cat.id, depth + 1)}
                  </ul>
                </div>
              ` : ''}
            </li>
          `;
        });
        return out;
      }

      html += renderTreeNodes(null, 1);
      html += `</ul>`;
      container.innerHTML = html;
      lucide.createIcons();
    };

    window.selectCategory = (idOrName) => {
      selectedCategory = idOrName;
      window.renderFileCategories();
      window.renderFiles();
    };

    // 視圖切換
    window.setViewMode = (mode) => {
      viewMode = mode;
      localStorage.setItem('files_view_mode', mode);
      
      const btnList = document.getElementById('btnListView');
      const btnGrid = document.getElementById('btnGridView');
      const container = document.getElementById('fileListContainer');
      
      if (mode === 'grid') {
        btnList.classList.remove('active');
        btnGrid.classList.add('active');
        container.classList.add('grid');
      } else {
        btnList.classList.add('active');
        btnGrid.classList.remove('active');
        container.classList.remove('grid');
      }
      
      window.renderFiles();
    };

    // ===================================
    //  多選與批次操作邏輯
    // ===================================

    // 當個別檔案核取方塊被更改
    window.handleFileSelect = (cb, id) => {
      if (cb.checked) {
        if (!selectedFileIds.includes(id)) {
          selectedFileIds.push(id);
        }
      } else {
        selectedFileIds = selectedFileIds.filter(x => x !== id);
      }
      window.updateBatchActionsBar();
    };

    // 全選/取消全選
    window.toggleSelectAll = (cb) => {
      const checkboxes = document.querySelectorAll('.file-checkbox');
      if (cb.checked) {
        selectedFileIds = [];
        checkboxes.forEach(box => {
          box.checked = true;
          selectedFileIds.push(box.value);
        });
      } else {
        checkboxes.forEach(box => {
          box.checked = false;
        });
        selectedFileIds = [];
      }
      window.updateBatchActionsBar();
    };

    // 更新批次操作工具列顯示狀態與全選狀態
    window.updateBatchActionsBar = () => {
      const bar = document.getElementById('batchActionsBar');
      const label = document.getElementById('selectedCountLabel');
      const selectAllCheckbox = document.getElementById('selectAllCheckbox');
      const totalCheckboxes = document.querySelectorAll('.file-checkbox').length;

      const rolePerms = localPermissions[currentUserRole] || { upload: false, editOwn: false, editAll: false, deleteOwn: false, deleteAll: false, manageCategory: false, manageStaff: false };

      // 檢查是否具有批次刪除按鈕，並依角色控制隱顯
      const batchDeleteBtn = document.querySelector('#batchActionsBar .btn-danger');
      if (batchDeleteBtn) {
        batchDeleteBtn.style.display = rolePerms.deleteAll ? 'inline-flex' : 'none';
      }

      if (selectedFileIds.length > 0) {
        bar.style.display = 'inline-flex';
        label.textContent = `已選取 ${selectedFileIds.length} 個檔案`;
        
        // 全選狀態連動
        if (selectAllCheckbox) {
          selectAllCheckbox.checked = selectedFileIds.length === totalCheckboxes && totalCheckboxes > 0;
        }
      } else {
        bar.style.display = 'none';
        if (selectAllCheckbox) {
          selectAllCheckbox.checked = false;
        }
      }
    };

    // 批次刪除
    window.promptBatchDelete = () => {
      const rolePerms = localPermissions[currentUserRole] || { deleteAll: false };
      if (selectedFileIds.length === 0 || !rolePerms.deleteAll) return;
      
      window.openConfirmModal('批次刪除確認', `確定要將已選擇的 ${selectedFileIds.length} 個檔案永久刪除嗎？此操作將無法復原。`, async () => {
        if(!currentUser) return;
        try {
          await Promise.all(selectedFileIds.map(id => deleteDoc(getDocRef('files', id))));
          selectedFileIds = [];
          window.updateBatchActionsBar();
          window.closeConfirmModal();
        } catch (error) {
          console.error("Batch delete error: ", error);
        }
      });
    };

    // 批次下載
    window.batchDownload = () => {
      if (selectedFileIds.length === 0) return;
      
      const filesToDownload = localFiles.filter(f => selectedFileIds.includes(f.id));
      
      filesToDownload.forEach((file, index) => {
        setTimeout(() => {
          const a = document.createElement('a');
          a.href = file.url;
          a.target = '_blank';
          a.download = file.fileName || file.name;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          
          window.incrementDownloadCount(file.id);
        }, index * 400); // 400 毫秒間隔
      });
    };

    // 遞增下載次數
    window.incrementDownloadCount = async (id) => {
      if(!currentUser) return;
      const file = localFiles.find(f => f.id === id);
      const name = file ? file.name : '未知檔案';
      try {
        await updateDoc(getDocRef('files', id), {
          downloads: increment(1)
        });
        await writeAuditLog('DOWNLOAD', name, '開啟並下載了此技術檔案');
      } catch (e) {
        console.error("Error incrementing downloads counter:", e);
      }
    };


    // ===================================
    //  各項新增與編輯邏輯 (Firestore 串接)
    // ===================================
    // 動態填充檔案上傳/編輯對話框中的分類下拉選單 (支援 5 層階層標註)
    function populateFileCategorySelect(selectedVal = null) {
      const select = document.getElementById('addFileCategory');
      if (!select) return;
      
      function buildSelectOptions(parentId = null, depth = 1) {
        if (depth > 5) return '';
        let nodes = localFileCategories.filter(c => parentId === null ? !c.parentId : c.parentId === parentId);
        
        // 模式 A：上傳/編輯檔案時的分類下拉選單也套用完全隱形過濾
        nodes = nodes.filter(c => isCategoryVisible(c.id));

        nodes.sort((a, b) => {
          if (a.isProtected !== b.isProtected) return a.isProtected ? -1 : 1;
          const orderA = a.sortOrder !== undefined ? a.sortOrder : 0;
          const orderB = b.sortOrder !== undefined ? b.sortOrder : 0;
          return orderA - orderB || a.createdAt - b.createdAt;
        });

        let out = '';
        nodes.forEach(node => {
          const isSel = (node.id === selectedVal || node.name === selectedVal) ? 'selected' : '';
          let indent = '';
          if (depth === 1) indent = '📁 ';
          else if (depth === 2) indent = '　└ 📁 ';
          else if (depth === 3) indent = '　　└ 📁 ';
          else if (depth === 4) indent = '　　　└ 📁 ';
          else if (depth === 5) indent = '　　　　└ 📄 ';

          out += `<option value="${node.id}" ${isSel}>${indent}${node.name} (第${depth}層)</option>`;
          out += buildSelectOptions(node.id, depth + 1);
        });
        return out;
      }

      select.innerHTML = buildSelectOptions(null, 1);
    }

    // 全公司部門核取方塊連動控制
    window.handleAllCompanyCheckbox = (allCb) => {
      const boxes = document.getElementsByName('addFileDept');
      boxes.forEach(b => {
        if (allCb && allCb.checked) {
          b.checked = true;
          b.disabled = true;
        } else {
          b.disabled = false;
        }
      });
    };

    window.handleEditCategoryAllCompanyCheckbox = (allCb) => {
      const boxes = document.getElementsByName('editCategoryDept');
      boxes.forEach(b => {
        if (allCb && allCb.checked) {
          b.checked = true;
          b.disabled = true;
        } else {
          b.disabled = false;
        }
      });
    };

    // 開啟新增/編輯檔案視窗
    window.openAddFileModal = (e = null, fileId = null) => {
      if(e) e.stopPropagation();
      editingFileId = fileId;
      const form = document.getElementById('addFileForm');
      const titleEl = document.getElementById('addFileModalTitle');
      const submitBtn = document.getElementById('fileSubmitBtn');
      const inputWrapper = document.getElementById('fileInputWrapper');
      const fileInput = document.getElementById('addFileInput');
      const uploaderInput = document.getElementById('addFileUploader');
      
      document.getElementById('fileUploadMessage').classList.remove('active');
      document.getElementById('fileInputLabel').textContent = "拖曳檔案至此或點擊選取";
      submitBtn.disabled = false;

      // 依據身分將「上傳者姓名」欄位限制為當前使用者名稱並改為唯讀
      uploaderInput.value = currentUserName;
      if (currentUserRole === 'Uploader' || currentUserRole === 'Admin' || currentUserRole === 'Editor') {
        uploaderInput.readOnly = true;
        uploaderInput.style.backgroundColor = '#e2e8f0';
        uploaderInput.style.cursor = 'not-allowed';
      } else {
        uploaderInput.readOnly = false;
        uploaderInput.style.backgroundColor = '';
        uploaderInput.style.cursor = '';
      }

      if(fileId) {
        // 編輯模式
        const file = localFiles.find(f => f.id === fileId);
        if(!file) return;
        document.getElementById('addFileName').value = file.name;
        uploaderInput.value = file.uploader || '';
        document.getElementById('addFileDescription').value = file.description || '';
        document.getElementById('addFileAccessOverride').value = file.accessLevelOverride || 'Inherit';

        // 載入發行部門對象
        const depts = file.targetDepts || ['全公司'];
        const allCb = document.getElementById('addFileDept_All');
        allCb.checked = depts.includes('全公司');
        
        const boxes = document.getElementsByName('addFileDept');
        boxes.forEach(b => {
          b.checked = depts.includes(b.value);
        });
        
        window.handleAllCompanyCheckbox(allCb);
        
        populateFileCategorySelect(file.category);
        inputWrapper.style.display = 'none';
        fileInput.removeAttribute('required');
        
        titleEl.innerHTML = '<i data-lucide="edit-3" class="w-5 h-5 text-primary"></i> 編輯檔案資訊';
        submitBtn.innerHTML = '儲存修改';
      } else {
        // 新增上傳模式
        form.reset();
        uploaderInput.value = currentUserName;
        const defaultCatDoc = localFileCategories.find(c => !c.isProtected);
        const defaultCatVal = defaultCatDoc ? defaultCatDoc.id : FALLBACK_CATEGORY;
        populateFileCategorySelect(defaultCatVal);
        
        // 手動調用分類變更監聽，加載該分類的預設發行對象與權限設定
        const catSelect = document.getElementById('addFileCategory');
        catSelect.value = defaultCatVal;
        const changeEvent = new Event('change');
        catSelect.dispatchEvent(changeEvent);

        document.getElementById('addFileAccessOverride').value = 'Inherit';
        inputWrapper.style.display = 'block';
        fileInput.setAttribute('required', 'true');
        
        titleEl.innerHTML = '<i data-lucide="upload-cloud" class="w-5 h-5 text-primary"></i> 上傳技術文件';
        submitBtn.innerHTML = '確認上傳';
      }

      openModal('addFileModal');
    };

    window.closeAddFileModal = () => {
      closeModal('addFileModal');
      editingFileId = null;
    };

    // 線上預覽與浮水印控制
    window.openPreviewModal = async (id, name, url) => {
      const iframe = document.getElementById('previewIframe');
      const title = document.getElementById('previewModalTitle');
      const overlay = document.getElementById('previewWatermarkOverlay');
      
      if (!iframe || !overlay) return;

      title.textContent = `線上預覽：${name}`;
      
      // 處理浮水印與點擊攔截 (僅針對 Viewer / 一般訪客顯示)
      const blocker = document.getElementById('previewClickBlocker');
      if (currentUserRole === 'Viewer') {
        const dateStr = new Date().toISOString().split('T')[0];
        const text = `${currentUserName} (${currentUserDept}) | ${dateStr} 內部機密 嚴禁翻拍`;
        
        // 繪製斜向平鋪浮水印 (改用半透明石板灰，在白底文件上清晰可見)
        const canvas = document.createElement('canvas');
        canvas.width = 320;
        canvas.height = 200;
        const ctx = canvas.getContext('2d');
        ctx.rotate(-20 * Math.PI / 180);
        ctx.font = '700 12px "Microsoft JhengHei", Arial';
        ctx.fillStyle = 'rgba(100, 116, 139, 0.18)'; 
        ctx.fillText(text, 10, 150);
        
        overlay.style.backgroundImage = `url(${canvas.toDataURL()})`;
        overlay.style.backgroundRepeat = 'repeat';
        overlay.style.display = 'block';
        
        if (blocker) blocker.style.display = 'block';
      } else {
        overlay.style.display = 'none';
        if (blocker) blocker.style.display = 'none';
      }

      // 提取檔案路徑部分（排除問號後面的 Token 參數）進行副檔名判定，避免 endsWith 判定失效
      const urlPath = url.split('?')[0].toLowerCase();
      let finalPreviewUrl = url;
      
      if (urlPath.includes('.pdf') || urlPath.endsWith('.pdf')) {
        // PDF 檔案可直接使用原生 iframe 內嵌 (加 toolbar=0 隱藏下載工具列)
        finalPreviewUrl = `${url}#toolbar=0`;
      } else if (urlPath.endsWith('.doc') || urlPath.endsWith('.docx') || urlPath.endsWith('.xls') || urlPath.endsWith('.xlsx') || urlPath.endsWith('.ppt') || urlPath.endsWith('.pptx')) {
        // Word, Excel 或 PowerPoint 技術文件，採用 Google Docs Viewer 線上服務內嵌預覽
        finalPreviewUrl = `https://docs.google.com/viewer?url=${encodeURIComponent(url)}&embedded=true`;
      }

      iframe.src = finalPreviewUrl;

      // 寫入線上預覽操作日誌
      await writeAuditLog('PREVIEW', name, '在瀏覽器線上預覽了此技術文件');

      openModal('previewFileModal');
    };

    window.closePreviewModal = () => {
      const iframe = document.getElementById('previewIframe');
      if (iframe) iframe.src = 'about:blank'; // 清除載入
      closeModal('previewFileModal');
    };

    // 提交上傳或修改檔案資料
    window.submitFile = async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('fileSubmitBtn');
      const msgBox = document.getElementById('fileUploadMessage');

      if (!currentUser) return;
      
      const name = document.getElementById('addFileName').value.trim();
      const category = document.getElementById('addFileCategory').value;
      const uploader = document.getElementById('addFileUploader').value.trim();
      const description = document.getElementById('addFileDescription').value.trim();
      const accessLevelOverride = document.getElementById('addFileAccessOverride').value;

      // 取得選取的發行適用部門
      const targetDepts = [];
      if (document.getElementById('addFileDept_All').checked) {
        targetDepts.push('全公司');
      } else {
        const boxes = document.getElementsByName('addFileDept');
        boxes.forEach(b => {
          if (b.checked) targetDepts.push(b.value);
        });
      }

      // 重複檔案上傳防呆機制 (方案 A：直接阻擋)
      if (!editingFileId) {
        // 1. 比對檔案顯示名稱
        const duplicateName = localFiles.find(f => f.name === name);
        if (duplicateName) {
          msgBox.textContent = `上傳失敗：技術檔案名稱「${name}」已存在於資料庫中！`;
          msgBox.className = "msg-box msg-box-danger active";
          return;
        }

        // 2. 比對實體檔案名稱
        const fileInput = document.getElementById('addFileInput');
        const selectedFile = fileInput ? fileInput.files[0] : null;
        if (selectedFile) {
          const duplicateFile = localFiles.find(f => f.fileName === selectedFile.name);
          if (duplicateFile) {
            msgBox.textContent = `上傳失敗：實體檔案「${selectedFile.name}」已上傳過 (已存在對應技術檔案為: ${duplicateFile.name})！`;
            msgBox.className = "msg-box msg-box-danger active";
            return;
          }
        }
      }

      submitBtn.disabled = true;
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> 處理中...';
      lucide.createIcons();

      try {
        if (editingFileId) {
          // 更新資料庫記錄
          await updateDoc(getDocRef('files', editingFileId), {
            name,
            category,
            uploader,
            description,
            accessLevelOverride,
            targetDepts
          });
          
          // 寫入編輯操作日誌
          await writeAuditLog('EDIT', name, `編輯了技術檔案資訊 (分類: ${resolveCategoryName(category)})`);
          
          window.closeAddFileModal();
        } else {
          // 全新上傳檔案
          const fileInput = document.getElementById('addFileInput');
          const file = fileInput.files[0];
          if (!file) throw new Error("尚未選擇檔案");

          const allowedExtensions = ['pdf', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx'];
          const fileExt = file.name.split('.').pop().toLowerCase();
          if (!allowedExtensions.includes(fileExt)) {
            throw new Error(`檔案類型錯誤：.${fileExt}。只允許 PDF, Word, Excel 或 PPT 簡報技術檔案。`);
          }
          if (file.size > 50 * 1024 * 1024) {
            throw new Error(`檔案大小超過 50MB 上限 (${(file.size / 1024 / 1024).toFixed(2)} MB)，請選擇較小的檔案！`);
          }

          let downloadURL = "";
          try {
            const uniqueFileName = `${Date.now()}_${file.name}`;
            const storageRef = ref(storage, `documents/${uniqueFileName}`);
            const snapshot = await uploadBytes(storageRef, file);
            downloadURL = await getDownloadURL(snapshot.ref);
          } catch (storageError) {
            console.warn("Storage upload failed, falling back to dummy link.", storageError);
            msgBox.textContent = "提醒：儲存空間權限未開放，已採用虛擬測試連結。";
            msgBox.className = "msg-box msg-box-warning active";
            downloadURL = "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf";
            await new Promise(r => setTimeout(r, 1200));
          }

          // 寫入 Firestore 檔案紀錄
          await addDoc(getCollectionRef('files'), {
            name,
            category,
            url: downloadURL,
            fileName: file.name,
            size: (file.size / 1024 / 1024).toFixed(2) + ' MB',
            date: new Date().toISOString().split('T')[0],
            createdAt: Date.now(),
            uploader,
            description,
            downloads: 0,
            accessLevelOverride,
            targetDepts
          });

          // 寫入上傳操作日誌
          await writeAuditLog('UPLOAD', name, `上傳了新技術檔案 (檔名: ${file.name}, 分類: ${resolveCategoryName(category)})`);

          window.closeAddFileModal();
        }
      } catch (error) {
        msgBox.textContent = "發生錯誤：" + error.message;
        msgBox.className = "msg-box msg-box-danger active";
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }
    };

    // 刪除檔案確認
    window.promptDeleteFile = (id, name) => {
      window.openConfirmModal('刪除確認', `您確定要永久刪除技術檔案「${name}」嗎？此操作無法還原。`, async () => {
        if(!currentUser) return;
        await deleteDoc(getDocRef('files', id));
        
        // 寫入刪除操作日誌
        await writeAuditLog('DELETE', name, '永久刪除檔案');
        
        selectedFileIds = selectedFileIds.filter(x => x !== id);
        window.updateBatchActionsBar();
        window.closeConfirmModal();
      });
    };

    // ===================================
    //  分類標籤管理 (Firestore 串接)
    // ===================================

    window.openManageCategoryModal = () => {
      const rolePerms = localPermissions[currentUserRole] || { manageCategory: false };
      if (!rolePerms.manageCategory) return;
      openModal('manageCategoryModal');
      window.renderFileCategoriesManage();
    };

    window.closeManageCategoryModal = () => {
      closeModal('manageCategoryModal');
    };

    // 渲染管理分類對話框中的分類清單 (支援 5 層階梯與第 1 層繼承標籤)
    window.renderFileCategoriesManage = () => {
      const container = document.getElementById('categoryListContainer');
      if(!container) return;

      // 同步更新「建立新分類」選單中的上級分類選項 (深度 < 5 方可選擇)
      const parentSelect = document.getElementById('newCategoryParent');
      if (parentSelect) {
        function buildParentOptions(parentId = null, depth = 1) {
          if (depth > 5) return '';
          let nodes = localFileCategories.filter(c => parentId === null ? !c.parentId : c.parentId === parentId);
          if (currentUserRole !== 'Admin') {
            nodes = nodes.filter(c => isCategoryVisible(c.id));
          }
          nodes.sort((a, b) => {
            if (a.isProtected !== b.isProtected) return a.isProtected ? -1 : 1;
            const orderA = a.sortOrder !== undefined ? a.sortOrder : 0;
            const orderB = b.sortOrder !== undefined ? b.sortOrder : 0;
            return orderA - orderB || a.createdAt - b.createdAt;
          });

          let out = '';
          nodes.forEach(node => {
            let indent = '';
            if (depth === 1) indent = '📁 ';
            else if (depth === 2) indent = '　└ 📁 ';
            else if (depth === 3) indent = '　　└ 📁 ';
            else if (depth === 4) indent = '　　　└ 📁 ';
            else if (depth === 5) indent = '　　　　└ 📄 ';

            if (depth >= 5) {
              out += `<option value="${node.id}" disabled style="color: #94a3b8;">${indent}${node.name} (第 5 層 - 已達深度上限)</option>`;
            } else {
              out += `<option value="${node.id}">${indent}${node.name} (第 ${depth} 層)</option>`;
            }
            out += buildParentOptions(node.id, depth + 1);
          });
          return out;
        }

        parentSelect.innerHTML = '<option value="">無 (作為第 1 層大類)</option>' + buildParentOptions(null, 1);
      }

      // 遞迴渲染管理分類項目清單
      function renderManageTreeList(parentId = null, depth = 1) {
        if (depth > 5) return '';
        let nodes = localFileCategories.filter(c => parentId === null ? !c.parentId : c.parentId === parentId);
        if (currentUserRole !== 'Admin') {
          nodes = nodes.filter(c => isCategoryVisible(c.id));
        }
        nodes.sort((a, b) => {
          if (a.isProtected !== b.isProtected) return a.isProtected ? -1 : 1;
          const orderA = a.sortOrder !== undefined ? a.sortOrder : 0;
          const orderB = b.sortOrder !== undefined ? b.sortOrder : 0;
          return orderA - orderB || a.createdAt - b.createdAt;
        });

        if (nodes.length === 0) return '';

        const movableNodes = nodes.filter(m => !m.isProtected);
        let out = '';

        nodes.forEach(cat => {
          const children = localFileCategories.filter(c => c.parentId === cat.id);
          const hasChildren = children.length > 0 && depth < 5;
          const isCollapsed = collapsedManageCategories[cat.id] !== undefined ? collapsedManageCategories[cat.id] : true;

          // 判定上下移動按鈕可用性
          const nodeIndex = movableNodes.findIndex(m => m.id === cat.id);
          const isFirst = nodeIndex === 0;
          const isLast = nodeIndex === movableNodes.length - 1;

          // 展開/收合按鈕
          let toggleHtml = '';
          if (hasChildren) {
            toggleHtml = `
              <span class="category-tree-toggle" onclick="window.toggleManageCategoryCollapse('${cat.id}', event)" style="margin-right: 4px;" title="${isCollapsed ? '展開子分類' : '收合子分類'}">
                <i data-lucide="${isCollapsed ? 'chevron-right' : 'chevron-down'}" class="w-3.5 h-3.5"></i>
              </span>
            `;
          } else {
            toggleHtml = `<span style="width: 22px; display: inline-block;"></span>`;
          }

          // 資訊與繼承文字
          let infoHtml = '';
          let depthBadge = '';
          if (depth === 1) {
            const defaultAccess = cat.defaultAccessLevel || 'Viewer';
            const defaultDepts = (cat.defaultTargetDepts || ['全公司']).join(', ');
            depthBadge = `<span class="category-badge" style="background-color: var(--color-primary-light); color: var(--color-primary); border-color: var(--color-primary-border); font-size: 0.68rem; padding: 1px 5px;">第 1 層 (大類)</span>`;
            infoHtml = `預設等級：${defaultAccess} | 預設部門：${defaultDepts}`;
          } else {
            const root = getRootCategory(cat.id);
            depthBadge = `<span class="category-badge" style="font-size: 0.68rem; padding: 1px 5px;">第 ${depth} 層</span>`;
            infoHtml = `🔗 繼承第 1 層【${root ? root.name : ''}】(${root ? root.defaultAccessLevel : 'Viewer'})`;
          }

          const indentStyle = depth > 1 ? `margin-left: ${(depth - 1) * 16}px; border-left: 2px solid var(--color-border); padding-left: 8px;` : '';
          const bgStyle = depth === 1 ? 'background-color: var(--color-bg); font-weight: 700;' : 'background-color: var(--color-surface);';

          let iconName = 'folder';
          if (cat.isProtected) iconName = 'lock';
          else if (depth === 1) iconName = 'folder-open';
          else if (depth >= 4) iconName = 'file-text';
          else iconName = 'folder';

          out += `
            <div class="cat-list-item" style="flex-wrap: wrap; gap: 8px; margin-top: 6px; ${indentStyle} ${bgStyle}">
              <div class="cat-list-item-left" style="flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; flex: 1;">
                <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
                  ${toggleHtml}
                  <i data-lucide="${iconName}" class="w-4 h-4 ${depth === 1 ? 'text-primary' : 'text-muted'}"></i>
                  <span style="font-size: 0.88rem;">${cat.name}</span>
                  ${depthBadge}
                </div>
                <span style="font-size: 0.72rem; color: var(--color-muted); font-weight: normal; margin-left: 26px;">
                  ${infoHtml}
                </span>
              </div>
              ${!cat.isProtected ? `
                <div style="display: flex; align-items: center; gap: 2px;">
                  <button onclick="window.moveCategory('${cat.id}', 'up')" class="btn-icon" title="上移" ${isFirst ? 'disabled style="opacity: 0.3; cursor: not-allowed;"' : ''}>
                    <i data-lucide="chevron-up" class="w-4 h-4"></i>
                  </button>
                  <button onclick="window.moveCategory('${cat.id}', 'down')" class="btn-icon" title="下移" ${isLast ? 'disabled style="opacity: 0.3; cursor: not-allowed;"' : ''}>
                    <i data-lucide="chevron-down" class="w-4 h-4"></i>
                  </button>
                  <button onclick="window.openEditCategoryModal('${cat.id}', '${cat.name.replace(/'/g, "\\'")}')" class="btn-icon" title="修改屬性與權限">
                    <i data-lucide="edit-3" class="w-4 h-4"></i>
                  </button>
                  <button onclick="window.promptDeleteCategory('${cat.id}', '${cat.name.replace(/'/g, "\\'")}')" class="btn-icon text-danger" title="刪除分類">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                  </button>
                </div>
              ` : '<span class="cat-badge-system">預設</span>'}
            </div>
          `;

          // 遞迴渲染子分類
          if (hasChildren && !isCollapsed) {
            out += renderManageTreeList(cat.id, depth + 1);
          }
        });

        return out;
      }

      container.innerHTML = renderManageTreeList(null, 1) || '<div class="text-muted text-center py-4">無分類資料</div>';
      lucide.createIcons();
    };

    window.toggleManageCategoryCollapse = (catId, event) => {
      if (event) event.stopPropagation();
      const current = collapsedManageCategories[catId] !== undefined ? collapsedManageCategories[catId] : true;
      collapsedManageCategories[catId] = !current;
      window.renderFileCategoriesManage();
    };

    // 調整分類順序 (在同一個父節點下同層互換)
    window.moveCategory = async (id, direction) => {
      const cat = localFileCategories.find(c => c.id === id);
      if (!cat) return;
      
      let siblings = [];
      if (!cat.parentId) {
        // 第 1 層大類互換 (不包含系統預設分類，保持預設在最前)
        siblings = localFileCategories.filter(c => !c.parentId && !c.isProtected);
      } else {
        // 第 2~5 層：同一父分類底下的子分類互換
        siblings = localFileCategories.filter(c => c.parentId === cat.parentId);
      }
      siblings.sort((a, b) => {
        const orderA = a.sortOrder !== undefined ? a.sortOrder : 0;
        const orderB = b.sortOrder !== undefined ? b.sortOrder : 0;
        return orderA - orderB || a.createdAt - b.createdAt;
      });
      
      const currentIndex = siblings.findIndex(c => c.id === id);
      if (currentIndex === -1) return;
      
      let targetIndex = -1;
      if (direction === 'up' && currentIndex > 0) {
        targetIndex = currentIndex - 1;
      } else if (direction === 'down' && currentIndex < siblings.length - 1) {
        targetIndex = currentIndex + 1;
      }
      
      if (targetIndex !== -1) {
        const targetCat = siblings[targetIndex];
        
        const currentOrder = cat.sortOrder !== undefined ? cat.sortOrder : currentIndex;
        const targetOrder = targetCat.sortOrder !== undefined ? targetCat.sortOrder : targetIndex;
        
        await updateDoc(getDocRef('fileCategories', cat.id), { sortOrder: targetOrder });
        await updateDoc(getDocRef('fileCategories', targetCat.id), { sortOrder: currentOrder });
      }
    };

    // 新增標籤分類 (支援 5 層深度限制)
    window.submitNewCategory = async (e) => {
      e.preventDefault();
      const rolePerms = localPermissions[currentUserRole] || { manageCategory: false };
      if(!currentUser || !rolePerms.manageCategory) return;
      const input = document.getElementById('newCategoryName');
      const parentInput = document.getElementById('newCategoryParent');
      
      const name = input.value.trim();
      const parentId = parentInput ? parentInput.value : '';

      if (!name) {
        alert("分類名稱不能為空！");
        return;
      }
      if (name.length > 20) {
        alert("分類名稱長度不能超過 20 個字元！");
        return;
      }
      const normalized = name.toLowerCase();
      if (localFileCategories.some(c => c.name.trim().toLowerCase() === normalized)) {
        alert("此分類名稱已存在！");
        return;
      }

      // 深度檢查 (最大 5 層深度)
      if (parentId) {
        const parentDepth = getCategoryDepth(parentId);
        if (parentDepth >= 5) {
          alert("所選上級分類已達第 5 層深度上限，無法再建立子分類！");
          return;
        }
      }

      // 取得同層最大 sortOrder 以放至最後
      const siblings = localFileCategories.filter(c => parentId ? c.parentId === parentId : !c.parentId);
      const maxOrder = siblings.reduce((max, c) => {
        const o = c.sortOrder !== undefined ? c.sortOrder : 0;
        return o > max ? o : max;
      }, 0);

      const newDoc = {
        name,
        parentId: parentId || '',
        isProtected: false,
        createdAt: Date.now(),
        sortOrder: maxOrder + 1
      };

      // 僅第 1 層（大類）配置預設安全等級與發行部門，其餘子層自動繼承
      if (!parentId) {
        newDoc.defaultAccessLevel = 'Viewer';
        newDoc.defaultTargetDepts = ['全公司'];
      }

      await addDoc(getCollectionRef('fileCategories'), newDoc);
      input.value = '';
      if (parentInput) parentInput.value = '';
    };

    let editCatContext = null;
    
    // 開啟編輯分類名稱與權限對話框 (支援 5 層防呆與第 1 層繼承切換)
    window.openEditCategoryModal = (id, oldName) => {
      const rolePerms = localPermissions[currentUserRole] || { manageCategory: false };
      if (!rolePerms.manageCategory) return;
      
      const cat = localFileCategories.find(c => c.id === id);
      if (!cat) return;

      editCatContext = { id, oldName, ...cat };
      
      document.getElementById('editCategoryInput').value = oldName;
      document.getElementById('editCategoryAccess').value = cat.defaultAccessLevel || 'Viewer';
      
      // 計算自身子樹高度與後代 ID（防止循環引用與深度超標）
      const subtreeHeight = getCategorySubtreeHeight(id);
      const descendantIds = getAllDescendantCategoryIds(id);
      
      const editParentSelect = document.getElementById('editCategoryParent');
      if (editParentSelect) {
        function buildEditParentOptions(parentId = null, depth = 1) {
          if (depth > 5) return '';
          let nodes = localFileCategories.filter(c => parentId === null ? !c.parentId : c.parentId === parentId);
          nodes.sort((a, b) => {
            if (a.isProtected !== b.isProtected) return a.isProtected ? -1 : 1;
            const orderA = a.sortOrder !== undefined ? a.sortOrder : 0;
            const orderB = b.sortOrder !== undefined ? b.sortOrder : 0;
            return orderA - orderB || a.createdAt - b.createdAt;
          });

          let out = '';
          nodes.forEach(node => {
            // 排除自己與所有後代節點
            if (descendantIds.includes(node.id)) return;

            let indent = '';
            if (depth === 1) indent = '📁 ';
            else if (depth === 2) indent = '　└ 📁 ';
            else if (depth === 3) indent = '　　└ 📁 ';
            else if (depth === 4) indent = '　　　└ 📁 ';
            else if (depth === 5) indent = '　　　　└ 📄 ';

            const isExceedingDepth = (depth + subtreeHeight > 5);
            if (isExceedingDepth) {
              out += `<option value="${node.id}" disabled style="color: #94a3b8;">${indent}${node.name} (第${depth}層 - 搬移後將超過5層限制)</option>`;
            } else {
              out += `<option value="${node.id}">${indent}${node.name} (第 ${depth} 層)</option>`;
            }

            out += buildEditParentOptions(node.id, depth + 1);
          });
          return out;
        }

        editParentSelect.innerHTML = '<option value="">無 (作為第 1 層大類)</option>' + buildEditParentOptions(null, 1);
        editParentSelect.value = cat.parentId || '';
      }
      
      const isProtected = cat.isProtected || cat.name === FALLBACK_CATEGORY;
      const depts = isProtected ? ['全公司'] : (cat.defaultTargetDepts || ['全公司']);
      const allCb = document.getElementById('editCategoryDept_All');
      if (allCb) {
        allCb.checked = depts.includes('全公司');
        allCb.disabled = isProtected;
      }
      
      const boxes = document.getElementsByName('editCategoryDept');
      boxes.forEach(b => {
        b.checked = depts.includes(b.value);
        b.disabled = isProtected || (allCb && allCb.checked);
      });
      if (allCb && !isProtected) window.handleEditCategoryAllCompanyCheckbox(allCb);

      // 切換第 1 層設定與第 2~5 層繼承提示
      window.handleEditCategoryParentChange(editParentSelect);
      
      openModal('editCategoryModal');
    };

    // 處理編輯視窗中上級分類切換時的 UI 顯示連動
    window.handleEditCategoryParentChange = (select) => {
      const parentVal = select ? select.value : '';
      const rootSettingsGroup = document.getElementById('editCategoryRootSettingsGroup');
      const inheritNotice = document.getElementById('editCategoryInheritNotice');

      if (!parentVal) {
        // 設定為第 1 層大類：顯示安全等級與發行部門配置
        if (rootSettingsGroup) rootSettingsGroup.style.display = 'block';
        if (inheritNotice) inheritNotice.style.display = 'none';
      } else {
        // 設定為第 2~5 層子分類：隱藏並提示繼承第 1 層設定
        if (rootSettingsGroup) rootSettingsGroup.style.display = 'none';
        if (inheritNotice) {
          const rootCat = getRootCategory(parentVal);
          const rootName = rootCat ? rootCat.name : '頂層大類';
          const rootAccess = rootCat ? (rootCat.defaultAccessLevel || 'Viewer') : 'Viewer';
          const rootDepts = rootCat ? (rootCat.defaultTargetDepts || ['全公司']).join(', ') : '全公司';
          
          inheritNotice.innerHTML = `
            <div style="display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--color-primary); margin-bottom: 4px;">
              <i data-lucide="info" class="w-4 h-4"></i>
              <span>自動繼承機制</span>
            </div>
            <div>此子分類自動繼承第 1 層【<strong style="color:var(--color-dark);">${rootName}</strong>】之預設設定：</div>
            <div style="margin-top: 4px; padding-left: 8px;">
              • 預設安全等級：<strong>${rootAccess}</strong><br>
              • 預設發行部門：<strong>${rootDepts}</strong>
            </div>
          `;
          inheritNotice.style.display = 'block';
          lucide.createIcons();
        }
      }
    };

    window.closeEditCategoryModal = () => {
      closeModal('editCategoryModal');
      editCatContext = null;
    };

    // 儲存修改的分類名稱與屬性
    window.confirmEditCategory = async () => {
      const rolePerms = localPermissions[currentUserRole] || { manageCategory: false };
      if(!currentUser || !editCatContext || !rolePerms.manageCategory) return;
      
      const newName = document.getElementById('editCategoryInput').value.trim();
      const newAccess = document.getElementById('editCategoryAccess').value;
      const editParentSelect = document.getElementById('editCategoryParent');
      const newParentId = editParentSelect ? editParentSelect.value : '';

      if (!newName) {
        alert("分類名稱不能為空！");
        return;
      }
      if (newName.length > 20) {
        alert("分類名稱長度不能超過 20 個字元！");
        return;
      }
      const normalized = newName.toLowerCase();
      if (localFileCategories.some(c => c.id !== editCatContext.id && c.name.trim().toLowerCase() === normalized)) {
        alert("此分類名稱已存在！");
        return;
      }

      // 搬移深度防呆驗證
      if (newParentId) {
        const parentDepth = getCategoryDepth(newParentId);
        const subtreeHeight = getCategorySubtreeHeight(editCatContext.id);
        if (parentDepth + subtreeHeight > 5) {
          alert("搬移後該子樹層級將超過 5 層限制，操作已取消！");
          return;
        }
      }

      // 取得修改的部門預設對象
      const depts = [];
      const allCb = document.getElementById('editCategoryDept_All');
      if (allCb && allCb.checked) {
        depts.push('全公司');
      } else {
        const boxes = document.getElementsByName('editCategoryDept');
        boxes.forEach(b => {
          if (b.checked) depts.push(b.value);
        });
      }
      
      // 1. 批次更新舊檔案中的分類標籤為新分類的 ID，確保關聯移轉並升級為 ID 關聯
      if (newName !== editCatContext.oldName) {
        const filesToUpdate = localFiles.filter(f => f.category === editCatContext.oldName || f.category === editCatContext.id);
        for(let f of filesToUpdate) {
          await updateDoc(getDocRef('files', f.id), { category: editCatContext.id });
        }
      }

      // 2. 更新分類本體
      const updateData = {
        name: newName,
        parentId: newParentId || ''
      };

      if (!newParentId) {
        updateData.defaultAccessLevel = newAccess;
        const isProtected = editCatContext.isProtected || editCatContext.name === FALLBACK_CATEGORY;
        updateData.defaultTargetDepts = (isProtected || depts.length === 0) ? ['全公司'] : depts;
      }

      await updateDoc(getDocRef('fileCategories', editCatContext.id), updateData);
      window.closeEditCategoryModal();
    };

    // 刪除分類標籤 (遞迴向下找出所有 1~5 層子孫分類，一併安全刪除並遷移檔案)
    window.promptDeleteCategory = (id, name) => {
      const rolePerms = localPermissions[currentUserRole] || { manageCategory: false };
      if (!rolePerms.manageCategory) return;
      
      // 遞迴收集所有子孫分類 ID
      const targetIds = getAllDescendantCategoryIds(id);
      
      // 計算受影響檔案數量
      const affectedFilesCount = localFiles.filter(f => 
        targetIds.includes(f.category)
      ).length;
      
      const subCatsCount = targetIds.length - 1;
      let confirmMsg = '';
      if (subCatsCount > 0) {
        confirmMsg = `確定刪除分類「${name}」？此操作會一併刪除其下的 ${subCatsCount} 個子分類，且這將影響 ${affectedFilesCount} 個檔案，受影響檔案會自動安全移至「${FALLBACK_CATEGORY}」。`;
      } else {
        confirmMsg = `確定刪除分類「${name}」？此操作將影響 ${affectedFilesCount} 個檔案，受影響檔案會自動安全移至「${FALLBACK_CATEGORY}」。`;
      }
      
      window.openConfirmModal(
        '刪除分類確認', 
        confirmMsg, 
        async () => {
          if(!currentUser) return;
          
          // 找出屬於被刪除分類(包含所有子孫分類)的檔案
          const filesToUpdate = localFiles.filter(f => 
            targetIds.includes(f.category)
          );
          
          for(let f of filesToUpdate) {
            await updateDoc(getDocRef('files', f.id), { category: FALLBACK_CATEGORY });
          }
          
          // 批次刪除該分類及其所有子孫分類
          for(let catId of targetIds) {
            // 系統保護分類不可刪除
            const catDoc = localFileCategories.find(c => c.id === catId);
            if (catDoc && !catDoc.isProtected) {
              await deleteDoc(getDocRef('fileCategories', catId));
            }
          }
          
          window.closeConfirmModal();
        }
      );
    };

    // ===================================
    //  通用對話框控制器 (Modal Helpers)
    // ===================================

    function openModal(id) {
      const modal = document.getElementById(id);
      if (modal) {
        modal.classList.add('active');
      }
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      if (modal) {
        modal.classList.remove('active');
      }
    }

    // 通用確認視窗開關
    let confirmAction = null;
    window.openConfirmModal = (title, desc, action) => {
      document.getElementById('confirmModalTitle').textContent = title;
      document.getElementById('confirmModalDesc').textContent = desc;
      confirmAction = action;
      openModal('actionConfirmModal');
    };

    window.closeConfirmModal = () => {
      closeModal('actionConfirmModal');
      confirmAction = null;
    };

    document.getElementById('confirmModalActionBtn').addEventListener('click', () => {
      if(confirmAction) confirmAction();
    });

    // 綁定鍵盤 ESC 鍵關閉所有彈出視窗
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal('addFileModal');
        closeModal('manageCategoryModal');
        closeModal('editCategoryModal');
        closeModal('actionConfirmModal');
        closeModal('loginModal');
        closeModal('manageStaffModal');
        closeModal('editStaffModal');
      }
    });

    // 啟動頁面
    window.onload = init;
  </script>
</body>
</html>
