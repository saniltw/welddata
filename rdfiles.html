<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>技術檔案資料庫 - 中控管理系統</title>
  
  <!-- 引入 Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <!-- 引入 Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* ================= 設計系統與變數 ================= */
    :root {
      --font-primary: 'Outfit', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      
      /* 色彩定義 */
      --color-primary: #0284c7;        /* 科技電弧藍 */
      --color-primary-hover: #0369a1;
      --color-primary-light: #f0f9ff;
      --color-primary-border: #bae6fd;
      
      --color-warning: #ea580c;        /* 工安警示橘 */
      --color-warning-hover: #c2410c;
      --color-warning-light: #fff7ed;
      --color-warning-border: #ffedd5;

      --color-danger: #ef4444;         /* 危險紅 */
      --color-danger-hover: #dc2626;
      --color-danger-light: #fef2f2;
      --color-danger-border: #fee2e2;

      --color-success: #10b981;        /* 成功綠 */
      --color-success-light: #ecfdf5;
      --color-success-border: #a7f3d0;

      --color-dark: #0f172a;           /* 深 slate 色 */
      --color-muted: #64748b;          /* 灰色 */
      --color-border: #e2e8f0;         /* 框線灰 */
      --color-bg: #f8fafc;             /* 背景金屬灰 */
      --color-surface: #ffffff;        /* 面板純白 */

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.08);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ================= 基礎樣式 ================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-primary);
      background-color: var(--color-bg);
      color: var(--color-dark);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        linear-gradient(rgba(203, 213, 225, 0.25) 1px, transparent 1px),
        linear-gradient(90deg, rgba(203, 213, 225, 0.25) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    /* 斜紋警示帶 */
    .warning-stripes {
      height: 6px;
      width: 100%;
      background-image: repeating-linear-gradient(45deg, var(--color-warning) 0, var(--color-warning) 10px, #ffffff 10px, #ffffff 20px);
      opacity: 0.95;
    }

    /* ================= 頁首/導覽列 ================= */
    header {
      background-color: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: var(--shadow-sm);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon-wrapper {
      background-color: var(--color-primary-light);
      border: 1px solid var(--color-primary-border);
      padding: 10px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon-wrapper i {
      color: var(--color-primary);
      animation: spin 12s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .brand-text h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--color-dark);
    }

    .brand-text span {
      font-size: 0.75rem;
      color: var(--color-muted);
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* 身份顯示狀態區 */
    .user-status-area {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: var(--color-bg);
      border: 1px solid var(--color-border);
      padding: 6px 12px;
      border-radius: var(--radius-md);
    }
    
    .user-status-text {
      font-size: 0.8rem;
      font-weight: 750;
      color: var(--color-muted);
      white-space: nowrap;
    }

    /* 按鈕樣式 */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
    }

    .btn-xs {
      padding: 6px 10px;
      font-size: 0.75rem;
      border-radius: var(--radius-sm);
    }

    .btn-primary {
      background-color: var(--color-primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--color-primary-hover);
    }

    .btn-secondary {
      background-color: var(--color-surface);
      color: var(--color-dark);
      border-color: var(--color-border);
      box-shadow: var(--shadow-sm);
    }

    .btn-secondary:hover {
      background-color: var(--color-bg);
      border-color: var(--color-muted);
    }

    .btn-secondary.active {
      background-color: var(--color-primary-light);
      color: var(--color-primary);
      border-color: var(--color-primary-border);
    }

    .btn-danger {
      background-color: var(--color-danger-light);
      color: var(--color-danger);
      border-color: var(--color-danger-border);
    }

    .btn-danger:hover {
      background-color: var(--color-danger);
      color: #ffffff;
    }

    .btn-icon {
      padding: 8px;
      border-radius: var(--radius-sm);
      color: var(--color-muted);
      background: transparent;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .btn-icon:hover {
      background-color: var(--color-bg);
      color: var(--color-dark);
    }

    .btn-icon.active {
      background-color: var(--color-primary-light);
      color: var(--color-primary);
      border: 1px solid var(--color-primary-border);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ================= 主內容區 ================= */
    main {
      max-width: 1200px;
      width: 100%;
      margin: 32px auto;
      padding: 0 24px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* 控制與搜尋面板 */
    .control-panel {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .search-wrapper {
      position: relative;
      width: 100%;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-muted);
      pointer-events: none;
      display: flex;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      font-size: 0.875rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      outline: none;
      transition: var(--transition);
      font-family: var(--font-primary);
    }

    .search-input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    /* 樹狀分類導覽佈局 (方案 B) */
    .db-content-layout {
      display: flex;
      gap: 20px;
      margin-top: 8px;
    }

    .category-tree-sidebar {
      width: 250px;
      flex-shrink: 0;
      border-right: 1px solid var(--color-border);
      padding-right: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .category-tree-sidebar-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: var(--color-dark);
      font-size: 0.95rem;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--color-border);
    }

    .db-files-area {
      flex-grow: 1;
      min-width: 0;
    }

    .category-tree-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .category-tree-item {
      display: flex;
      flex-direction: column;
    }

    .category-tree-row {
      display: flex;
      align-items: center;
      padding: 8px 10px;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 0.875rem;
      color: var(--color-muted);
      transition: var(--transition);
      user-select: none;
    }

    .category-tree-row:hover {
      background-color: var(--color-bg);
      color: var(--color-dark);
    }

    .category-tree-row.active {
      background-color: rgba(2, 132, 199, 0.08);
      color: var(--color-primary);
      font-weight: 600;
    }

    .category-tree-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      margin-right: 6px;
      cursor: pointer;
      color: var(--color-muted);
      transition: var(--transition);
    }

    .category-tree-toggle:hover {
      background-color: var(--color-border);
      color: var(--color-dark);
    }

    .category-tree-icon {
      margin-right: 8px;
      display: flex;
      align-items: center;
    }

    .category-tree-children {
      margin-left: 20px;
      padding-left: 10px;
      border-left: 1px dashed var(--color-border);
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 4px;
      margin-bottom: 4px;
    }

    @media (max-width: 768px) {
      .db-content-layout {
        flex-direction: column;
      }
      .category-tree-sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--color-border);
        padding-right: 0;
        padding-bottom: 16px;
      }
      .category-tree-children {
        margin-left: 16px;
        padding-left: 8px;
      }
    }

    .tag-btn {
      white-space: nowrap;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      background-color: var(--color-surface);
      color: var(--color-muted);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }

    .tag-btn:hover {
      background-color: var(--color-bg);
      color: var(--color-dark);
    }

    .tag-btn.active {
      background-color: var(--color-primary);
      border-color: var(--color-primary);
      color: #ffffff;
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    /* ================= 檔案數據庫卡片 & 工具列 ================= */
    .database-card {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .db-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--color-border);
      gap: 12px;
      flex-wrap: wrap;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .select-all-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      color: var(--color-dark);
    }

    .batch-actions-bar {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background-color: var(--color-primary-light);
      border: 1px solid var(--color-primary-border);
      padding: 5px 12px;
      border-radius: var(--radius-md);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--color-primary);
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .toolbar-right {
      display: flex;
      gap: 6px;
    }

    .inset-container {
      background-color: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 8px;
      box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.02);
    }

    /* 檔案清單/網格模式 */
    .file-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 65vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    /* 網格視圖樣式 */
    .file-list.grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
      max-height: none;
      overflow-y: visible;
    }

    /* 單個檔案列/卡片 */
    .file-item {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      transition: var(--transition);
      gap: 16px;
      box-shadow: var(--shadow-sm);
    }

    .file-item:hover {
      border-color: var(--color-primary);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .file-selection {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .file-checkbox {
      width: 18px;
      height: 18px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--color-border);
      accent-color: var(--color-primary);
      cursor: pointer;
      transition: var(--transition);
    }

    .file-checkbox:hover {
      border-color: var(--color-primary);
    }

    .file-meta-side {
      display: flex;
      align-items: center;
      gap: 16px;
      overflow: hidden;
      flex-grow: 1;
    }

    .file-icon-box {
      background-color: var(--color-bg);
      border: 1px solid var(--color-border);
      padding: 10px;
      border-radius: var(--radius-md);
      color: var(--color-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .file-item:hover .file-icon-box {
      background-color: var(--color-primary-light);
      border-color: var(--color-primary-border);
      color: var(--color-primary);
    }

    .file-info {
      overflow: hidden;
      flex-grow: 1;
    }

    .file-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--color-dark);
      margin-bottom: 4px;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .file-details {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--color-muted);
      flex-wrap: wrap;
    }

    .category-badge {
      background-color: var(--color-bg);
      border: 1px solid var(--color-border);
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-weight: 600;
    }

    .detail-uploader, .detail-downloads {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background-color: var(--color-primary-light);
      color: var(--color-primary);
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-weight: 600;
    }
    
    .detail-downloads {
      background-color: var(--color-warning-light);
      color: var(--color-warning);
    }

    .file-desc-text {
      font-size: 0.8rem;
      color: var(--color-muted);
      margin-top: 8px;
      background-color: var(--color-bg);
      border-left: 3px solid var(--color-border);
      padding: 6px 12px;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    /* 網格視圖特有覆寫 */
    .file-list.grid .file-item {
      flex-direction: column;
      align-items: flex-start;
      padding: 18px;
      height: 100%;
    }

    .file-list.grid .file-item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
      margin-bottom: 8px;
    }

    .file-list.grid .file-meta-side {
      flex-direction: column;
      align-items: flex-start;
      width: 100%;
      gap: 12px;
    }

    .file-list.grid .file-info {
      width: 100%;
    }

    .file-list.grid .file-title {
      white-space: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
      font-size: 0.95rem;
    }

    .file-list.grid .file-desc-text {
      white-space: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      width: 100%;
    }

    .file-list.grid .file-actions {
      width: 100%;
      justify-content: flex-end;
      border-top: 1px solid var(--color-border);
      padding-top: 12px;
      margin-top: 12px;
    }

    .file-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-download {
      font-size: 0.75rem;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      border: 1px solid var(--color-border);
      background-color: var(--color-surface);
      color: var(--color-dark);
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      box-shadow: var(--shadow-sm);
    }

    .btn-download:hover {
      background-color: var(--color-primary);
      border-color: var(--color-primary);
      color: #ffffff;
    }

    /* 空狀態 */
    .empty-state {
      padding: 48px;
      text-align: center;
      color: var(--color-muted);
      border: 1px dashed var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface);
      font-size: 0.875rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .empty-state i {
      color: var(--color-border);
    }

    /* ================= 彈出視窗 (Modals) ================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      transition: opacity 0.2s ease-out;
    }

    .modal-backdrop.active {
      display: flex;
      opacity: 1;
    }

    .modal-card {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 520px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      transform: translateY(-20px);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
    }

    .modal-backdrop.active .modal-card {
      transform: translateY(0);
    }

    .modal-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 1.125rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--color-dark);
    }

    .modal-body {
      padding: 24px;
      overflow-y: auto;
      max-height: 60vh;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-footer {
      padding: 14px 24px;
      background-color: var(--color-bg);
      border-top: 1px solid var(--color-border);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    /* 表單元件 */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--color-dark);
    }

    .form-control {
      padding: 10px 14px;
      font-size: 0.875rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      outline: none;
      transition: var(--transition);
      font-family: var(--font-primary);
      background-color: var(--color-bg);
    }

    .form-control:focus {
      border-color: var(--color-primary);
      background-color: var(--color-surface);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    /* 檔案上傳輸入樣式 */
    .file-input-wrapper {
      border: 2px dashed var(--color-border);
      border-radius: var(--radius-md);
      padding: 20px;
      text-align: center;
      background-color: var(--color-bg);
      cursor: pointer;
      transition: var(--transition);
      position: relative;
    }

    .file-input-wrapper:hover {
      border-color: var(--color-primary);
      background-color: var(--color-primary-light);
    }

    .file-input-wrapper input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .file-input-desc {
      font-size: 0.825rem;
      color: var(--color-muted);
      margin-top: 6px;
    }

    .file-input-wrapper i {
      color: var(--color-muted);
      margin-bottom: 8px;
    }

    .file-input-wrapper:hover i {
      color: var(--color-primary);
    }

    /* 資訊/警告訊息框 */
    .msg-box {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      display: none;
    }
    
    .msg-box.active {
      display: block;
    }

    .msg-box-warning {
      background-color: var(--color-warning-light);
      border-color: var(--color-warning-border);
      color: var(--color-warning);
    }

    .msg-box-danger {
      background-color: var(--color-danger-light);
      border-color: var(--color-danger-border);
      color: var(--color-danger);
    }

    /* 分類列表 (管理分類視窗中) */
    .cat-list-container {
      background-color: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 250px;
      overflow-y: auto;
    }

    .cat-list-item {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.875rem;
      font-weight: 600;
    }

    .cat-list-item-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cat-badge-system {
      font-size: 0.75rem;
      color: var(--color-muted);
      background-color: var(--color-bg);
      padding: 2px 6px;
      border-radius: var(--radius-sm);
    }

    /* ================= 確認對話框 (特別主題) ================= */
    .confirm-modal {
      z-index: 70;
    }
    .confirm-modal .modal-card {
      max-width: 380px;
      border-top: 4px solid var(--color-danger);
    }

    .confirm-body {
      text-align: center;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .confirm-icon-wrapper {
      width: 64px;
      height: 64px;
      background-color: var(--color-danger-light);
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-danger);
    }

    .confirm-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--color-dark);
    }

    .confirm-desc {
      font-size: 0.875rem;
      color: var(--color-muted);
      line-height: 1.6;
    }

    .confirm-footer {
      display: flex;
      justify-content: center;
      gap: 12px;
      background: transparent;
      border: none;
      padding: 0 24px 32px 24px;
    }

    /* RWD 響應式微調 */
    @media (max-width: 768px) {
      .btn-text {
        display: none; /* 手機端只顯示按鈕圖示以防擁擠 */
      }
      .btn {
        padding: 10px;
      }
      .btn-download .btn-text {
        display: inline; /* 項目內下載按鈕保留文字 */
      }
      .btn-download {
        padding: 8px 14px;
      }
    }

    @media (max-width: 640px) {
      .nav-container {
        padding: 12px 16px;
      }
      main {
        margin: 16px auto;
        padding: 0 16px;
        gap: 16px;
      }
      .control-panel, .database-card {
        padding: 16px;
      }
      .file-item {
        flex-direction: column;
        align-items: flex-start;
        padding: 14px;
      }
      .file-meta-side {
        width: 100%;
      }
      .file-actions {
        width: 100%;
        justify-content: flex-end;
        border-top: 1px solid var(--color-border);
        padding-top: 10px;
        margin-top: 4px;
      }
    }
  </style>
</head>
<body>

  <div class="warning-stripes"></div>

  <!-- 頁首導覽 -->
  <header>
    <div class="nav-container">
      <div class="brand-section">
        <div class="brand-icon-wrapper">
          <i data-lucide="database" class="w-6 h-6"></i>
        </div>
        <div class="brand-text">
          <h1>技術檔案資料庫</h1>
          <span>TECHNICAL FILE REPOSITORY</span>
        </div>
      </div>
      <div class="header-actions">
        <!-- 身份切換區域 -->
        <div class="user-status-area">
          <span class="user-status-text" id="currentUserDisplay">👤 一般訪客 (唯讀)</span>
          <button onclick="window.openLoginModal()" class="btn btn-secondary btn-xs" id="loginBtn" style="padding: 6px 10px;">
            <i data-lucide="log-in" class="w-3.5 h-3.5"></i> <span class="btn-text">變更身分</span>
          </button>
        </div>

        <a href="RD.html" class="btn btn-secondary" style="display: inline-flex; align-items: center; gap: 6px; text-decoration: none;">
          <i data-lucide="arrow-left" class="w-4 h-4"></i> <span class="btn-text">返回中控台</span>
        </a>

        <button id="btnManageStaffHeader" onclick="window.openManageStaffModal()" class="btn btn-secondary" style="display: none;">
          <i data-lucide="users" class="w-4 h-4"></i> <span class="btn-text">人員管理</span>
        </button>
        <button id="btnManageCategoryHeader" onclick="window.openManageCategoryModal()" class="btn btn-secondary" style="display: none;">
          <i data-lucide="settings-2" class="w-4 h-4"></i> <span class="btn-text">管理分類</span>
        </button>
        <button id="btnUploadFileHeader" onclick="window.openAddFileModal()" class="btn btn-primary" style="display: none;">
          <i data-lucide="upload-cloud" class="w-4 h-4"></i> <span class="btn-text">上傳文件</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main>
    
    <!-- 搜尋與分類過濾面板 -->
    <section class="control-panel">
      <div class="search-wrapper" style="max-width: 100%; width: 100%;">
        <div class="search-icon">
          <i data-lucide="search" class="w-4 h-4"></i>
        </div>
        <input type="text" id="fileSearchInput" placeholder="搜尋檔案名稱、分類標籤、上傳者或真實檔名..." class="search-input" oninput="window.renderFiles()"/>
      </div>
    </section>

    <!-- 檔案數據庫卡片 -->
    <section class="database-card">
      
      <!-- 頂部批次與視圖工具列 -->
      <div class="db-toolbar">
        <div class="toolbar-left">
          <label class="select-all-label">
            <input type="checkbox" id="selectAllCheckbox" onchange="window.toggleSelectAll(this)" class="file-checkbox">
            <span>全選</span>
          </label>
          
          <!-- 浮動批次工具列 -->
          <div id="batchActionsBar" class="batch-actions-bar" style="display: none;">
            <span id="selectedCountLabel">已選擇 0 個項目</span>
            <button onclick="window.promptBatchDelete()" class="btn btn-danger btn-xs">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> 批次刪除
            </button>
            <button onclick="window.batchDownload()" class="btn btn-primary btn-xs">
              <i data-lucide="download" class="w-3.5 h-3.5"></i> 批次下載
            </button>
          </div>
        </div>
        
        <!-- 視圖切換器 -->
        <div class="toolbar-right">
          <button id="btnListView" onclick="window.setViewMode('list')" class="btn-icon active" title="列表視圖">
            <i data-lucide="list" class="w-4 h-4"></i>
          </button>
          <button id="btnGridView" onclick="window.setViewMode('grid')" class="btn-icon" title="網格視圖">
            <i data-lucide="grid" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- 檔案資料與分類導覽佈局 (方案 B 樹狀圖) -->
      <div class="db-content-layout">
        <!-- 左側樹狀分類導覽 -->
        <aside class="category-tree-sidebar">
          <div class="category-tree-sidebar-header">
            <i data-lucide="folder-tree" class="w-4 h-4 text-primary"></i>
            <span>資料庫分類</span>
          </div>
          <div id="categoryTreeContainer" class="category-tree-container">
            <!-- JS 動態樹狀圖 -->
          </div>
        </aside>

        <!-- 右側主內容區 -->
        <div class="db-files-area">
          <!-- 置頂「🔥 最新上傳」精選專區 -->
          <div id="recentUploadsWrapper" style="display: none; margin-bottom: 16px; border-bottom: 1px dashed var(--color-border); padding-bottom: 16px;">
            <div style="display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--color-warning); font-size: 0.9rem; margin-bottom: 8px;">
              <i data-lucide="flame" class="w-4.5 h-4.5" style="color: var(--color-warning);"></i>
              <span>最新上傳技術文件</span>
            </div>
            <div id="recentUploadsContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-bottom: 8px;">
              <!-- JS 動態置頂卡片 -->
            </div>
          </div>

          <div class="inset-container">
            <div id="fileListContainer" class="file-list">
              <!-- JS 動態檔案清單 -->
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- ======================= 各類 Modals 彈出視窗 ======================= -->

  <!-- 1. 新增/編輯檔案 Modal -->
  <div id="addFileModal" class="modal-backdrop">
    <form id="addFileForm" onsubmit="window.submitFile(event)" class="modal-card">
      <div class="modal-header">
        <h3 id="addFileModalTitle" class="modal-title"></h3>
        <button type="button" onclick="window.closeAddFileModal()" class="btn-icon">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="modal-body">
        
        <div id="fileInputWrapper" class="file-input-wrapper">
          <i data-lucide="upload" class="w-8 h-8"></i>
          <p class="form-label" id="fileInputLabel">拖曳檔案至此或點擊選取</p>
          <p class="file-input-desc">限制最大 10MB。支援副檔名: PDF, DOC, DOCX, XLS, XLSX</p>
          <input type="file" id="addFileInput" accept=".pdf,.doc,.docx,.xls,.xlsx" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="addFileName">檔案顯示名稱</label>
          <input type="text" id="addFileName" required placeholder="例如：機台維護標準規範 v1.2" class="form-control">
        </div>

        <div class="form-group">
          <label class="form-label" for="addFileCategory">所屬分類</label>
          <select id="addFileCategory" class="form-control">
            <!-- JS 動態產生選項 -->
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="addFileAccessOverride">安全限制等級</label>
          <select id="addFileAccessOverride" class="form-control" style="background-color: var(--color-surface);">
            <option value="Inherit">繼承分類預設設定</option>
            <option value="Viewer">一般檢視者 (Viewer) 可看</option>
            <option value="Uploader">技術上傳者 (Uploader) 可看</option>
            <option value="Editor">編輯管理員 (Editor) 可看</option>
            <option value="Admin">僅系統管理員 (Admin) 可看</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">發行對象 (適用部門，多選)</label>
          <div id="addFileDeptContainer" style="display: flex; gap: 12px; flex-wrap: wrap; background-color: var(--color-bg); padding: 10px 14px; border: 1px solid var(--color-border); border-radius: var(--radius-md);">
            <!-- JS 動態生成 -->
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="addFileUploader">上傳者姓名</label>
          <input type="text" id="addFileUploader" required placeholder="如：林建國" class="form-control">
        </div>

        <div class="form-group">
          <label class="form-label" for="addFileDescription">備註說明</label>
          <textarea id="addFileDescription" placeholder="輸入此檔案的簡短說明或更新摘要（選填）..." class="form-control" rows="3" style="resize: vertical; font-family: var(--font-primary);"></textarea>
        </div>

        <div id="fileUploadMessage" class="msg-box msg-box-danger"></div>
      </div>
      <div class="modal-footer">
        <button type="button" onclick="window.closeAddFileModal()" class="btn btn-secondary">取消</button>
        <button type="submit" id="fileSubmitBtn" class="btn btn-primary">確認上傳</button>
      </div>
    </form>
  </div>

  <!-- 2. 管理分類標籤 Modal -->
  <div id="manageCategoryModal" class="modal-backdrop">
    <div class="modal-card" style="max-width: 550px;">
      <div class="modal-header">
        <h3 class="modal-title">
          <i data-lucide="settings-2" class="w-5 h-5 text-primary"></i> 管理分類標籤
        </h3>
        <button onclick="window.closeManageCategoryModal()" class="btn-icon">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="modal-body">
        <div id="categoryListContainer" class="cat-list-container">
          <!-- JS 動態清單 -->
        </div>

        <form onsubmit="window.submitNewCategory(event)" class="form-group" style="margin-top: 16px; border-top: 1px dashed var(--color-border); padding-top: 16px;">
          <label class="form-label" style="font-weight:700;">建立新分類</label>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <div style="display: flex; gap: 8px;">
              <input type="text" id="newCategoryName" required placeholder="輸入新分類名稱..." class="form-control" style="flex-grow: 1;">
              <button type="submit" class="btn btn-primary" style="padding: 10px 16px;">新增</button>
            </div>
            <div>
              <label class="form-label" for="newCategoryParent" style="font-size:0.75rem; color:var(--color-muted); margin-bottom:4px;">上級分類 (留空則建立為大類)</label>
              <select id="newCategoryParent" class="form-control">
                <option value="">無 (作為大類)</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button onclick="window.closeManageCategoryModal()" class="btn btn-secondary">關閉</button>
      </div>
    </div>
  </div>

  <!-- 3. 編輯分類屬性與權限彈出視窗 (已擴充) -->
  <div id="editCategoryModal" class="modal-backdrop" style="background-color: rgba(15, 23, 42, 0.6); z-index: 60;">
    <div class="modal-card" style="max-width: 420px;">
      <div class="modal-header">
        <h3 class="modal-title">修改分類屬性</h3>
        <button onclick="window.closeEditCategoryModal()" class="btn-icon">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="editCategoryInput">分類名稱</label>
          <input type="text" id="editCategoryInput" class="form-control" placeholder="輸入新的分類名稱">
        </div>
        <div class="form-group" style="margin-top: 8px;">
          <label class="form-label" for="editCategoryParent">上級分類</label>
          <select id="editCategoryParent" class="form-control" style="background-color: var(--color-surface);">
            <option value="">無 (作為大類)</option>
          </select>
        </div>
        <div class="form-group" style="margin-top: 8px;">
          <label class="form-label" for="editCategoryAccess">預設安全等級限制</label>
          <select id="editCategoryAccess" class="form-control" style="background-color: var(--color-surface);">
            <option value="Viewer">檢視者 (Viewer) 以上可看</option>
            <option value="Uploader">上傳者 (Uploader) 以上可看</option>
            <option value="Editor">編輯管理員 (Editor) 以上可看</option>
            <option value="Admin">僅系統管理員 (Admin) 可看</option>
          </select>
        </div>
        <div class="form-group" style="margin-top: 8px;">
          <label class="form-label">預設發行部門對象</label>
          <div id="editCategoryDeptContainer" style="display: flex; gap: 8px; flex-wrap: wrap; background-color: var(--color-bg); padding: 8px 12px; border: 1px solid var(--color-border); border-radius: var(--radius-md);">
            <!-- JS 動態生成 -->
          </div>
        </div>
        <p style="font-size: 0.72rem; color: var(--color-muted); margin-top: 6px;">注意：變更後，該分類下目前設定為「繼承」之檔案將會套用新規則。</p>
      </div>
      <div class="modal-footer">
        <button onclick="window.closeEditCategoryModal()" class="btn btn-secondary">取消</button>
        <button onclick="window.confirmEditCategory()" class="btn btn-primary">確認修改</button>
      </div>
    </div>
  </div>

  <!-- 4. 通用危險確認視窗 (如刪除) -->
  <div id="actionConfirmModal" class="modal-backdrop confirm-modal">
    <div class="modal-card">
      <div class="confirm-body">
        <div class="confirm-icon-wrapper">
          <i data-lucide="alert-triangle" class="w-8 h-8"></i>
        </div>
        <h4 id="confirmModalTitle" class="confirm-title">確認執行此操作？</h4>
        <p id="confirmModalDesc" class="confirm-desc">此操作執行後將無法復原，請確認是否繼續。</p>
      </div>
      <div class="confirm-footer">
        <button onclick="window.closeConfirmModal()" class="btn btn-secondary">取消</button>
        <button id="confirmModalActionBtn" class="btn btn-danger" style="background-color: var(--color-danger); color: white;">確認執行</button>
      </div>
    </div>
  </div>

  <!-- 5. 身份驗證登入 Modal (方案 B) -->
  <div id="loginModal" class="modal-backdrop">
    <div class="modal-card" style="max-width: 400px;">
      <div class="modal-header">
        <h3 class="modal-title">
          <i data-lucide="user-check" class="w-5 h-5 text-primary"></i> 變更身分 / 登入
        </h3>
        <button onclick="window.closeLoginModal()" class="btn-icon">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <form id="loginForm" onsubmit="window.submitLogin(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="loginDeptSelect">第一步：選擇部門</label>
            <select id="loginDeptSelect" class="form-control" onchange="window.handleLoginDeptChange(this)">
              <!-- JS 動態填入部門 -->
            </select>
          </div>
          
          <div class="form-group" id="loginUserSelectGroup" style="margin-top: 8px; display: none;">
            <label class="form-label" for="loginUserSelect">第二步：選擇登入帳號</label>
            <select id="loginUserSelect" class="form-control" onchange="window.handleLoginUserChange(this)">
              <!-- JS 動態連動人員 -->
            </select>
          </div>
          
          <div id="loginRoleHint" style="font-size: 0.8rem; color: var(--color-muted); font-weight: 700; margin-top: 4px;">
            預期角色：讀取中...
          </div>

          <div class="form-group" id="loginPasswordGroup" style="display: none; margin-top: 8px;">
            <label class="form-label" for="loginPassword">角色驗證密碼</label>
            <input type="password" id="loginPassword" class="form-control" placeholder="請輸入對應角色密碼">
          </div>

          <div id="loginMessage" class="msg-box msg-box-danger"></div>
        </div>
        <div class="modal-footer">
          <button type="button" onclick="window.closeLoginModal()" class="btn btn-secondary">取消</button>
          <button type="submit" class="btn btn-primary">確認變更</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 6. 系統人員與權限管理對話框 (三頁籤配置) -->
  <div id="manageStaffModal" class="modal-backdrop">
    <div class="modal-card" style="max-width: 580px;">
      <div class="modal-header">
        <h3 class="modal-title">
          <i data-lucide="users" class="w-5 h-5 text-primary"></i> 人員與權限配置管理
        </h3>
        <button onclick="window.closeManageStaffModal()" class="btn-icon">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="modal-body" style="gap: 12px; padding: 20px 24px;">
        
        <!-- 頁籤導覽 -->
        <div style="display: flex; gap: 8px; border-bottom: 1px solid var(--color-border); padding-bottom: 10px; margin-bottom: 6px; flex-wrap: wrap;">
          <button id="tabBtnRoster" onclick="window.switchStaffTab('roster')" class="btn btn-secondary btn-xs active" style="font-weight: 700;">人員名冊管理</button>
          <button id="tabBtnPermissions" onclick="window.switchStaffTab('permissions')" class="btn btn-secondary btn-xs" style="font-weight: 700;">角色功能授權</button>
          <button id="tabBtnDepartments" onclick="window.switchStaffTab('departments')" class="btn btn-secondary btn-xs" style="font-weight: 700;">發行部門管理</button>
          <button id="tabBtnLogs" onclick="window.switchStaffTab('logs')" class="btn btn-secondary btn-xs" style="font-weight: 700;">系統操作日誌</button>
        </div>

        <!-- 頁籤一：名冊管理內容 -->
        <div id="staffTabRoster" style="display: block;">
          <!-- 人員清單容器 -->
          <div id="staffListContainer" class="cat-list-container" style="max-height: 200px;">

  <!-- ======================= Firebase 模組與資料邏輯 ======================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, doc, setDoc, deleteDoc, increment, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

    // Firebase 配置 (延用原專案之設置)
    const userFirebaseConfig = {
      apiKey: "AIzaSyA12XH2okeXVEgdztM_oKBXHbVWeYp0EGs",
      authDomain: "weldwps-93ec4.firebaseapp.com",
      projectId: "weldwps-93ec4",
      storageBucket: "weldwps-93ec4.firebasestorage.app",
      messagingSenderId: "734060477729",
      appId: "1:734060477729:web:b3cb8e6d0afa08e0cd9260",
      measurementId: "G-KTFKQQ3PJL"
    };

    const isPreviewEnv = typeof __firebase_config !== 'undefined';
    const firebaseConfig = isPreviewEnv ? JSON.parse(__firebase_config) : userFirebaseConfig;
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let currentUser = null;
    let localFiles = [];
    let localFileCategories = [];
    let localAttendance = []; // 人員清單 (方案 B & A)
    let selectedFileIds = []; // 用於記錄被勾選的檔案 ID
    
    // 方案 B 權限變數
    let currentUserName = localStorage.getItem('repo_user_name') || '一般訪客';
    let currentUserRole = localStorage.getItem('repo_user_role') || 'Viewer'; // 'Viewer', 'Uploader', 'Editor', 'Admin'
    let currentUserId = localStorage.getItem('repo_user_id') || 'visitor';
    let currentUserDept = localStorage.getItem('repo_user_dept') || '研發部'; // 部門設定
    
    // 編輯人員上下文
    let editStaffContext = null;

    // 角色權限設定 (與資料庫 system/permissions 同步)
    let localPermissions = {
      Viewer: { upload: false, editOwn: false, editAll: false, deleteOwn: false, deleteAll: false, manageCategory: false, manageStaff: false },
      Uploader: { upload: true, editOwn: true, editAll: false, deleteOwn: true, deleteAll: false, manageCategory: false, manageStaff: false },
      Editor: { upload: true, editOwn: true, editAll: true, deleteOwn: true, deleteAll: false, manageCategory: true, manageStaff: false },
      Admin: { upload: true, editOwn: true, editAll: true, deleteOwn: true, deleteAll: true, manageCategory: true, manageStaff: true }
    };

    // 動態部門列表 (與 system/departments 文件同步)
    let localDepartments = ["研發部", "品管部", "生產部", "採購部"];

    let selectedCategory = '全部';
    let editingFileId = null;
    let viewMode = 'list'; // 'list' 或 'grid'
    let isRecentUploadsHidden = false;

    const FALLBACK_CATEGORY = '📁 未分類 (暫存區)';

    // 樹狀分類展開收合狀態 (方案 B)
    let collapsedCategories = {};
    let collapsedManageCategories = {};

    // 解析分類名稱的輔助函式
    function resolveCategoryName(catIdOrName) {
      if (!catIdOrName) return FALLBACK_CATEGORY;
      const cat = localFileCategories.find(c => c.id === catIdOrName || c.name === catIdOrName);
      return cat ? cat.name : catIdOrName;
    }

    // 輔助路徑獲取器 (保證在預覽沙盒與正式環境皆能正確存取)
    function getCollectionRef(colName) {
      if (isPreviewEnv) return collection(db, 'artifacts', appId, 'public', 'data', colName);
      return collection(db, colName);
    }
    function getDocRef(colName, docId) {
      if (isPreviewEnv) return doc(db, 'artifacts', appId, 'public', 'data', colName, docId);
      return doc(db, colName, docId);
    }

    // 系統操作日誌變數與監聽
    let localAuditLogs = [];
    let auditLogsUnsubscribe = null;

    function setupAuditLogsListener() {
      if (auditLogsUnsubscribe) {
        auditLogsUnsubscribe();
        auditLogsUnsubscribe = null;
      }
      
      const q = query(getCollectionRef('fileAuditLogs'), orderBy('timestamp', 'desc'), limit(100));
      auditLogsUnsubscribe = onSnapshot(q, (snapshot) => {
        localAuditLogs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        if (document.getElementById('staffTabLogs').style.display === 'block') {
          window.renderAuditLogsList();
        }
      }, (e) => console.error("Audit Logs Listener Error:", e));
    }

    // 寫入系統日誌
    async function writeAuditLog(action, fileName, details) {
      if (!currentUser) return;
      try {
        await addDoc(getCollectionRef('fileAuditLogs'), {
          timestamp: Date.now(),
          action,
          operatorId: currentUserId,
          operatorName: currentUserName,
          operatorDept: currentUserDept,
          fileName,
          details
        });
      } catch (e) {
        console.error("Failed to write audit log:", e);
      }
    }

    // 根據人員與其設定的權限屬性獲得角色，若無設定則以職稱模糊匹配（相容舊格式）
    function getRoleFromMember(member) {
      if (!member) return 'Viewer';
      if (member.permission) return member.permission; // 直接讀取明確指定之權限

      // 模糊判定 Fallback
      const t = (member.role || '').toLowerCase();
      if (t.includes('編輯') || t.includes('editor')) {
        return 'Editor';
      }
      if (t.includes('主管') || t.includes('管理員') || t.includes('admin') || t.includes('manager')) {
        return 'Admin';
      }
      if (t.includes('工程師') || t.includes('管理師') || t.includes('uploader') || t.includes('staff')) {
        return 'Uploader';
      }
      return 'Viewer';
    }

    // 計算檔案最終生效的存取安全等級 (繼承與覆寫)
    function getEffectiveAccessLevel(file) {
      if (file.accessLevelOverride && file.accessLevelOverride !== 'Inherit') {
        return file.accessLevelOverride;
      }
      const catDoc = localFileCategories.find(c => c.id === file.category || c.name === file.category);
      return (catDoc && catDoc.defaultAccessLevel) ? catDoc.defaultAccessLevel : 'Viewer';
    }

    // 計算檔案最終發行適用部門 (繼承與覆寫)
    function getEffectiveTargetDepts(file) {
      if (file.targetDepts && file.targetDepts.length > 0) {
        return file.targetDepts;
      }
      const catDoc = localFileCategories.find(c => c.id === file.category || c.name === file.category);
      return (catDoc && catDoc.defaultTargetDepts) ? catDoc.defaultTargetDepts : ['全公司'];
    }

    // 初始化預設分類及子分類 (方案 B)
    async function seedInitialFileCategories() {
      if(!currentUser) return;
      const mainCats = [
        { name: FALLBACK_CATEGORY, isProtected: true, createdAt: 1 },
        { name: 'SOP標準作業程序', isProtected: false, createdAt: 2 },
        { name: '工安與環保規章', isProtected: false, createdAt: 3 },
        { name: '設備操作手冊', isProtected: false, createdAt: 4 }
      ];
      
      const ids = {};
      for(let c of mainCats) {
        const docRef = await addDoc(getCollectionRef('fileCategories'), c);
        ids[c.name] = docRef.id;
      }
      
      // 子分類
      const subCats = [
        { name: '生產線SOP', parentId: ids['SOP標準作業程序'], isProtected: false, createdAt: 5, defaultAccessLevel: 'Viewer', defaultTargetDepts: ['全公司'] },
        { name: '檢驗流程SOP', parentId: ids['SOP標準作業程序'], isProtected: false, createdAt: 6, defaultAccessLevel: 'Viewer', defaultTargetDepts: ['全公司'] },
        { name: '鍋爐操作指引', parentId: ids['設備操作手冊'], isProtected: false, createdAt: 7, defaultAccessLevel: 'Viewer', defaultTargetDepts: ['全公司'] },
        { name: '機台保養手冊', parentId: ids['設備操作手冊'], isProtected: false, createdAt: 8, defaultAccessLevel: 'Viewer', defaultTargetDepts: ['全公司'] }
      ];
      for(let sc of subCats) {
        await addDoc(getCollectionRef('fileCategories'), sc);
      }
    }

    // 初始化登入與資料監聽
    async function init() {
      // 讀取本地端暫存的視圖模式
      const savedMode = localStorage.getItem('files_view_mode');
      if (savedMode) {
        window.setViewMode(savedMode);
      }

      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (error) {
        console.error("Auth error:", error);
      }

      onAuthStateChanged(auth, (user) => {
        if (user) {
          currentUser = user;
          setupDatabaseListeners();
          window.checkPermissions();
        }
      });

      // 檔案選取後的名稱帶入、格式檢查與檔案大小驗證
      document.getElementById('addFileInput').addEventListener('change', function(e) {
        const msgBox = document.getElementById('fileUploadMessage');
        const submitBtn = document.getElementById('fileSubmitBtn');
        
        msgBox.classList.remove('active');
        submitBtn.disabled = false;

        if (this.files && this.files[0]) {
          const file = this.files[0];
          const nameWithoutExt = file.name.replace(/\.[^/.]+$/, "");
          const nameInput = document.getElementById('addFileName');
          
          // 1. 副檔名驗證
          const allowedExtensions = ['pdf', 'doc', 'docx', 'xls', 'xlsx'];
          const fileExt = file.name.split('.').pop().toLowerCase();
          
          if (!allowedExtensions.includes(fileExt)) {
            msgBox.textContent = `檔案類型錯誤：.${fileExt}。只允許 PDF, Word 或 Excel 技術檔案。`;
            msgBox.className = "msg-box msg-box-danger active";
            submitBtn.disabled = true;
            this.value = ''; // 清除選取
            return;
          }
          
          // 2. 大小限制驗證 (10MB)
          const maxSize = 10 * 1024 * 1024;
          if (file.size > maxSize) {
            msgBox.textContent = `檔案超出大小限制：${(file.size / 1024 / 1024).toFixed(2)} MB。上限為 10.00 MB。`;
            msgBox.className = "msg-box msg-box-danger active";
            submitBtn.disabled = true;
            this.value = ''; // 清除選取
            return;
          }

          if (!nameInput.value) nameInput.value = nameWithoutExt;
          document.getElementById('fileInputLabel').textContent = "已選擇: " + file.name;
        }
      });

      // 檔案分類選取聯動，載入預設的發行對象與安全限制等級
      document.getElementById('addFileCategory').addEventListener('change', function(e) {
        const catId = this.value;
        const catDoc = localFileCategories.find(c => c.id === catId || c.name === catId);
        if (catDoc) {
          const depts = catDoc.defaultTargetDepts || ['全公司'];
          const allCb = document.getElementById('addFileDept_All');
          
          allCb.checked = depts.includes('全公司');
          
          const boxes = document.getElementsByName('addFileDept');
          boxes.forEach(b => {
            b.checked = depts.includes(b.value);
          });
          
          window.handleAllCompanyCheckbox(allCb);
        }
      });
    }

    // 數據即時監聽與更新
    function setupDatabaseListeners() {
      if (!currentUser) return;

      // 監聽發行對象部門清單 (後台自訂)
      onSnapshot(getDocRef('system', 'departments'), (docSnap) => {
        if (docSnap.exists()) {
          const rawList = docSnap.data().list || [];
          localDepartments = rawList.map(item => {
            if (typeof item === 'string') {
              return { name: item, defaultRole: 'Viewer', password: '' };
            }
            return item;
          });
        } else {
          // 初始化預設發行部門清單 (物件結構)
          setDoc(getDocRef('system', 'departments'), {
            list: [
              { name: "研發部", defaultRole: "Uploader", password: "rd123" },
              { name: "品管部", defaultRole: "Uploader", password: "qa123" },
              { name: "生產部", defaultRole: "Viewer", password: "" },
              { name: "採購部", defaultRole: "Viewer", password: "" }
            ]
          }).catch(e => console.error("Seeding initial departments failed: ", e));
        }
        window.renderDepartmentSelects();
        
        // 若當前登入者為部門帳號，且該部門已被自系統中刪除，則自動回歸一般訪客身分
        const isDept = currentUserId !== 'visitor' && currentUserId.startsWith('dept_');
        if (isDept) {
          const deptName = currentUserId.substring(5); // 剝離 "dept_"
          const stillExists = localDepartments.some(d => (typeof d === 'string' ? d : d.name) === deptName);
          if (!stillExists) {
            currentUserName = '一般訪客';
            currentUserRole = 'Viewer';
            currentUserId = 'visitor';
            currentUserDept = '研發部';
            localStorage.setItem('repo_user_name', currentUserName);
            localStorage.setItem('repo_user_role', currentUserRole);
            localStorage.setItem('repo_user_id', currentUserId);
            localStorage.setItem('repo_user_dept', currentUserDept);
            window.checkPermissions();
            window.renderFiles();
          }
        }
      }, (e) => console.error("Departments Listener Error:", e));

      // 監聽角色功能權限設定
      onSnapshot(getDocRef('system', 'permissions'), (docSnap) => {
        if (docSnap.exists()) {
          localPermissions = docSnap.data();
        } else {
          // 初始化預設角色權限
          setDoc(getDocRef('system', 'permissions'), {
            Viewer: { upload: false, editOwn: false, editAll: false, deleteOwn: false, deleteAll: false, manageCategory: false, manageStaff: false },
            Uploader: { upload: true, editOwn: true, editAll: false, deleteOwn: true, deleteAll: false, manageCategory: false, manageStaff: false },
            Editor: { upload: true, editOwn: true, editAll: true, deleteOwn: true, deleteAll: false, manageCategory: true, manageStaff: false },
            Admin: { upload: true, editOwn: true, editAll: true, deleteOwn: true, deleteAll: true, manageCategory: true, manageStaff: true }
          }).catch(e => console.error("Seeding initial permissions failed: ", e));
        }
        window.checkPermissions();
        window.renderFiles();
      }, (e) => console.error("Permissions Listener Error:", e));

      // 監聽人員名單庫 (方案 B & A)
      onSnapshot(getCollectionRef('attendance'), (snapshot) => {
        localAttendance = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        localAttendance.sort((a, b) => (a.order || 0) - (b.order || 0));
        
        // 若當前開啟人員管理視窗，則重新渲染名單
        const manageStaffModal = document.getElementById('manageStaffModal');
        if (manageStaffModal && manageStaffModal.classList.contains('active')) {
          window.renderStaffList();
        }

        // 若當前登入者為個人帳號，且因任何原因被自人員名冊中除名，則自動回歸一般訪客身分
        const isPerson = currentUserId !== 'visitor' && currentUserId.startsWith('person_');
        if (isPerson) {
          const rawPersonId = currentUserId.substring(7); // 剝離 "person_" 前綴
          if (!localAttendance.some(p => p.id === rawPersonId)) {
            currentUserName = '一般訪客';
            currentUserRole = 'Viewer';
            currentUserId = 'visitor';
            currentUserDept = '研發部';
            localStorage.setItem('repo_user_name', currentUserName);
            localStorage.setItem('repo_user_role', currentUserRole);
            localStorage.setItem('repo_user_id', currentUserId);
            localStorage.setItem('repo_user_dept', currentUserDept);
            window.checkPermissions();
            window.renderFiles();
          }
        }
      }, (e) => console.error("Attendance Listener Error:", e));

      // 監聽檔案資料庫
      onSnapshot(getCollectionRef('files'), (snapshot) => {
        localFiles = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        selectedFileIds = selectedFileIds.filter(id => localFiles.some(f => f.id === id));
        window.renderFiles();
      }, (e) => console.error("Files Listener Error:", e));

      // 監聽分類列表
      onSnapshot(getCollectionRef('fileCategories'), (snapshot) => {
        if (snapshot.empty && localFileCategories.length === 0) {
          seedInitialFileCategories();
        } else {
          localFileCategories = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          localFileCategories.sort((a, b) => (a.isProtected === b.isProtected) ? (a.createdAt - b.createdAt) : (a.isProtected ? -1 : 1));
          window.renderFileCategories();
          window.renderFileCategoriesManage();
          window.renderFiles();
        }
      }, (e) => console.error("File Categories Listener Error:", e));
      
      // 啟動操作日誌監聽
      setupAuditLogsListener();
    }

    // ===================================
    //  權限驗證與 UI 狀態變更 (方案 B)
    // ===================================
    
    window.checkPermissions = () => {
      const display = document.getElementById('currentUserDisplay');
      const btnManageCategory = document.getElementById('btnManageCategoryHeader');
      const btnUploadFile = document.getElementById('btnUploadFileHeader');
      const btnManageStaff = document.getElementById('btnManageStaffHeader');
      
      const rolePerms = localPermissions[currentUserRole] || { upload: false, editOwn: false, editAll: false, deleteOwn: false, deleteAll: false, manageCategory: false, manageStaff: false };

      const deptLabel = currentUserId === 'visitor' ? '' : ` (${currentUserDept})`;

      if (currentUserRole === 'Admin') {
        display.innerHTML = `⚙️ ${currentUserName}${deptLabel} (管理員)`;
        display.style.color = 'var(--color-warning)';
      } else if (currentUserRole === 'Editor') {
        display.innerHTML = `✍️ ${currentUserName}${deptLabel} (編輯管理員)`;
        display.style.color = 'var(--color-success)';
      } else if (currentUserRole === 'Uploader') {
        display.innerHTML = `👤 ${currentUserName}${deptLabel} (上傳者)`;
        display.style.color = 'var(--color-primary)';
      } else {
        display.innerHTML = `👤 ${currentUserName}${deptLabel} (唯讀)`;
        display.style.color = 'var(--color-muted)';
      }
      
      btnUploadFile.style.display = rolePerms.upload ? 'inline-flex' : 'none';
      btnManageCategory.style.display = rolePerms.manageCategory ? 'inline-flex' : 'none';
      btnManageStaff.style.display = rolePerms.manageStaff ? 'inline-flex' : 'none';

      // 更新全選狀態連動
      window.updateBatchActionsBar();
    };

    // 開啟登入視窗 (初始化第一層：部門)
    window.openLoginModal = () => {
      const deptSelect = document.getElementById('loginDeptSelect');
      const msgBox = document.getElementById('loginMessage');
      msgBox.classList.remove('active');

      // 取得發行部門與名冊人員實際部門的聯集，確保每個人的部門都能在第一層被選取
      const customDepts = localDepartments.map(d => typeof d === 'string' ? d : (d.name || ''));
      const attendanceDepts = [...new Set(localAttendance.map(p => p.department || '研發部'))];
      const allDepts = [...new Set([...customDepts, ...attendanceDepts])];

      // 載入第一層部門選項 (含一般訪客與所有聯集部門)
      let deptOptionsHtml = `<option value="visitor" ${currentUserId === 'visitor' ? 'selected' : ''}>一般訪客 (唯讀)</option>`;
      deptOptionsHtml += allDepts.map(deptName => {
        const isSelected = (currentUserId !== 'visitor' && currentUserDept === deptName);
        return `<option value="${deptName}" ${isSelected ? 'selected' : ''}>${deptName}</option>`;
      }).join('');
      
      deptSelect.innerHTML = deptOptionsHtml;
      
      // 觸發連動載入第二層
      window.handleLoginDeptChange(deptSelect);
      
      openModal('loginModal');
    };

    window.closeLoginModal = () => {
      closeModal('loginModal');
    };

    // 處理第一層部門選單變更 (動態過濾並產生第二層帳號選單)
    window.handleLoginDeptChange = (select) => {
      const deptVal = select.value;
      const userGroup = document.getElementById('loginUserSelectGroup');
      const userSelect = document.getElementById('loginUserSelect');
      
      if (deptVal === 'visitor') {
        userGroup.style.display = 'none';
        
        // 重設第二層為訪客
        userSelect.innerHTML = `<option value="visitor" data-type="visitor" data-role="Viewer">一般訪客 (唯讀)</option>`;
        userSelect.value = 'visitor';
        window.handleLoginUserChange(userSelect);
        return;
      }

      // 載入該部門對應的帳號
      userGroup.style.display = 'flex';
      
      // 1. 取得該部門公用帳號 (僅當該部門存在於自訂發行部門時才建立公用登入)
      const deptObj = localDepartments.find(d => d.name === deptVal);
      let optionsHtml = '';
      if (deptObj) {
        const deptRole = deptObj.defaultRole || 'Viewer';
        optionsHtml += `<option value="dept_${deptVal}" data-type="dept" data-role="${deptRole}">${deptVal} (公用帳號)</option>`;
      }
      
      // 2. 取得該部門名冊人員 (防禦性相容未設定部門而預設為研發部的人員)
      const personnel = localAttendance.filter(p => (p.department || '研發部') === deptVal);
      optionsHtml += personnel.map(p => {
        const roleStr = getRoleFromMember(p);
        return `<option value="person_${p.id}" data-type="person" data-role="${roleStr}">${p.name} - ${p.role}</option>`;
      }).join('');

      userSelect.innerHTML = optionsHtml;

      // 還原先前的選取狀態 (若當前登入者剛好在該部門中，或預設選取第一項)
      let defaultUserVal = deptObj ? `dept_${deptVal}` : (personnel.length > 0 ? `person_${personnel[0].id}` : '');
      if (currentUserId !== 'visitor' && currentUserDept === deptVal) {
        if (currentUserId.startsWith('dept_') || currentUserId.startsWith('person_')) {
          defaultUserVal = currentUserId;
        } else {
          defaultUserVal = 'person_' + currentUserId;
        }
      }
      
      // 檢查此預設值是否存在於選項中，若存在則套用
      if (defaultUserVal && [...userSelect.options].some(o => o.value === defaultUserVal)) {
        userSelect.value = defaultUserVal;
      }
      
      window.handleLoginUserChange(userSelect);
    };

    // 處理選擇登入帳號時的密碼欄位隱顯與提示
    window.handleLoginUserChange = (select) => {
      const option = select.options[select.selectedIndex];
      if (!option) return;
      
      const val = select.value;
      const type = option.getAttribute('data-type');
      const role = option.getAttribute('data-role');
      const hint = document.getElementById('loginRoleHint');
      const pwGroup = document.getElementById('loginPasswordGroup');
      const pwInput = document.getElementById('loginPassword');
      const msgBox = document.getElementById('loginMessage');
      
      msgBox.classList.remove('active');
      pwInput.value = '';

      let needsPassword = false;
      let passwordPrompt = '(請輸入您的個人專屬密碼)';

      if (type === 'dept') {
        const deptName = val.substring(5); // 剝離 "dept_"
        const dept = localDepartments.find(d => d.name === deptName);
        if (dept && dept.password) {
          needsPassword = true;
          passwordPrompt = `(請輸入【${deptName}】的部門公用密碼)`;
        }
      } else if (type === 'person') {
        const personId = val.substring(7); // 剝離 "person_"
        const person = localAttendance.find(p => p.id === personId);
        if (person && role !== 'Viewer' && person.password) {
          needsPassword = true;
          passwordPrompt = `(請輸入【${person.name}】的個人驗證密碼)`;
        }
      }

      if (needsPassword) {
        let roleLabel = '技術上傳者';
        let labelColor = 'var(--color-primary)';
        if (role === 'Admin') {
          roleLabel = '系統管理員';
          labelColor = 'var(--color-warning)';
        } else if (role === 'Editor') {
          roleLabel = '編輯管理員';
          labelColor = 'var(--color-success)';
        }
        hint.innerHTML = `判定權限：<span style="color:${labelColor};">${roleLabel}</span> ${passwordPrompt}`;
        pwGroup.style.display = 'flex';
        pwInput.setAttribute('required', 'true');
      } else {
        let roleLabel = '一般檢視者';
        if (role === 'Admin') roleLabel = '管理員';
        else if (role === 'Editor') roleLabel = '編輯管理員';
        else if (role === 'Uploader') roleLabel = '上傳者';
        
        hint.innerHTML = `判定權限：<span style="color:var(--color-muted);">${roleLabel}</span> (免驗證，可直接登入)`;
        pwGroup.style.display = 'none';
        pwInput.removeAttribute('required');
      }
    };

    // 提交身分變更 (驗證密碼與設定 Session)
    window.submitLogin = (e) => {
      e.preventDefault();
      const select = document.getElementById('loginUserSelect');
      const option = select.options[select.selectedIndex];
      if (!option) return;
      
      const val = select.value;
      const type = option.getAttribute('data-type');
      const role = option.getAttribute('data-role');
      const pwInput = document.getElementById('loginPassword');
      const msgBox = document.getElementById('loginMessage');

      // 驗證密碼
      if (type === 'dept') {
        const deptName = val.substring(5);
        const dept = localDepartments.find(d => d.name === deptName);
        if (dept && dept.password && pwInput.value !== dept.password) {
          msgBox.textContent = "部門公用密碼錯誤！請重新輸入。";
          msgBox.className = "msg-box msg-box-danger active";
          return;
        }
        
        currentUserName = `${deptName} (公用)`;
        currentUserRole = role;
        currentUserId = val;
        currentUserDept = deptName;
      } else if (type === 'person') {
        const personId = val.substring(7);
        const person = localAttendance.find(p => p.id === personId);
        if (person && role !== 'Viewer' && person.password && pwInput.value !== person.password) {
          msgBox.textContent = "個人驗證密碼錯誤！請重新確認。";
          msgBox.className = "msg-box msg-box-danger active";
          return;
        }
        
        currentUserName = person ? person.name : '未知人員';
        currentUserRole = role;
        currentUserId = val;
        currentUserDept = person ? (person.department || '研發部') : '研發部';
      } else {
        // visitor (訪客)
        currentUserName = '一般訪客';
        currentUserRole = 'Viewer';
        currentUserId = 'visitor';
        currentUserDept = '研發部';
      }

      // 儲存於 LocalStorage
      localStorage.setItem('repo_user_name', currentUserName);
      localStorage.setItem('repo_user_role', currentUserRole);
      localStorage.setItem('repo_user_id', currentUserId);
      localStorage.setItem('repo_user_dept', currentUserDept);

      window.checkPermissions();
      window.renderFiles(); // 重新渲染列表以更新編輯與刪除權限
      window.closeLoginModal();
    };

    // ===================================
    //  人員與編制管理功能 (方案 A)
    // ===================================

    window.openManageStaffModal = () => {
      if (currentUserRole !== 'Admin') return;
      openModal('manageStaffModal');
      window.switchStaffTab('roster');
      window.renderStaffList();
    };

    window.closeManageStaffModal = () => {
      closeModal('manageStaffModal');
      window.switchStaffTab('roster');

    // 人員管理後台四頁籤切換
    window.switchStaffTab = (tabName) => {
      const tabBtnRoster = document.getElementById('tabBtnRoster');
      const tabBtnPermissions = document.getElementById('tabBtnPermissions');
      const tabBtnDepartments = document.getElementById('tabBtnDepartments');
      const tabBtnLogs = document.getElementById('tabBtnLogs');
      
      const staffTabRoster = document.getElementById('staffTabRoster');
      const staffTabPermissions = document.getElementById('staffTabPermissions');
      const staffTabDepartments = document.getElementById('staffTabDepartments');
      const staffTabLogs = document.getElementById('staffTabLogs');
      
      const msgBoxPerm = document.getElementById('permissionsSaveMessage');
      const msgBoxDept = document.getElementById('deptSaveMessage');
      if (msgBoxPerm) msgBoxPerm.classList.remove('active');
      if (msgBoxDept) msgBoxDept.classList.remove('active');

      tabBtnRoster.classList.remove('active');
      tabBtnPermissions.classList.remove('active');
      tabBtnDepartments.classList.remove('active');
      if (tabBtnLogs) tabBtnLogs.classList.remove('active');
      
      staffTabRoster.style.display = 'none';
      staffTabPermissions.style.display = 'none';
      staffTabDepartments.style.display = 'none';
      if (staffTabLogs) staffTabLogs.style.display = 'none';

      if (tabName === 'roster') {
        tabBtnRoster.classList.add('active');
        staffTabRoster.style.display = 'block';
      } else if (tabName === 'permissions') {
        tabBtnPermissions.classList.add('active');
        staffTabPermissions.style.display = 'block';
        window.renderRolePermissionsConfig();
      } else if (tabName === 'departments') {
        tabBtnDepartments.classList.add('active');

    // 新增自訂發行部門 (寫入物件型態，含預設角色與密碼)

      const nameInput = document.getElementById('newDeptInputName');
      const roleSelect = document.getElementById('newDeptDefaultRole');
      const pwInput = document.getElementById('newDeptPassword');

      const defaultRole = roleSelect.value;
      const password = pwInput.value.trim();
      
      const msgBox = document.getElementById('deptSaveMessage');

        if (localDepartments.some(d => d.name === name)) {
          msgBox.textContent = "此部門名稱已存在！";
          msgBox.className = "msg-box msg-box-danger active";
          return;
        }
        
        try {
          const newList = [...localDepartments, { name, defaultRole, password }];

          pwInput.value = '';

    window.promptDeleteDepartmentByIndex = (index) => {

        if (msgBox) {

        return;

      const nameInput = document.getElementById('editDeptInputName');
      const roleSelect = document.getElementById('editDeptInputRole');
      const pwInput = document.getElementById('editDeptInputPassword');
      
      const newName = nameInput.value.trim();
      const defaultRole = roleSelect.value;
      const password = pwInput.value.trim();

      const isConflict = localDepartments.some((d, idx) => idx !== editDeptContextIndex && d.name === newName);
